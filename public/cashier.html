<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO DESIGN - Invoice System</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#ececec;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.invoice{
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.top-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px;
}

.logo-area h1{
font-size:50px;
font-weight:900;
color:#ff6600;
}

.logo-area p{
font-size:22px;
color:#666;
}

.invoice-title{
background:#00154f;
padding:30px 50px;
border-radius:0 0 0 50px;
color:#fff;
text-align:center;
}

.invoice-title h2{
font-size:50px;
font-weight:900;
}

.invoice-title span{
font-size:24px;
color:#ff6600;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.info-box{
border:2px solid #eee;
padding:20px;
border-radius:20px;
}

.info-box h3{
color:#ff6600;
margin-bottom:15px;
}

.info-box input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

.service-box{
padding:20px;
}

.service-box h3{
margin-bottom:15px;
color:#00154f;
}

.form-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.form-grid input{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

.add-btn{
margin-top:15px;
width:100%;
padding:15px;
border:none;
background:#ff6600;
color:#fff;
font-size:18px;
font-weight:bold;
border-radius:15px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

thead{
background:#00154f;
color:#fff;
}

th,td{
padding:12px;
text-align:center;
border:1px solid #eee;
}

.total-box{
margin:20px;
background:#ff6600;
color:#fff;
padding:20px;
border-radius:15px;
font-size:28px;
font-weight:900;
text-align:center;
}

.footer{
background:#00154f;
color:#fff;
padding:20px;
text-align:center;
line-height:2;
}

.actions{
padding:20px;
display:flex;
gap:10px;
}

.actions button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:#fff;
}

.print-btn{
background:#28a745;
}

.pdf-btn{
background:#ff6600;
}

.whatsapp-btn{
background:#25D366;
}

@media(max-width:768px){

.info-grid{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

.top-header{
flex-direction:column;
gap:20px;
}

.actions{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="container">

<div class="invoice">

<div class="top-header">

<div class="logo-area">
<h1>PRO DESIGN</h1>
<p>Aluminum & CNC</p>
</div>

<div class="invoice-title">
<h2>فاتورة</h2>
<span>INVOICE</span>
</div>

</div>

<div class="info-grid">

<div class="info-box">

<h3>بيانات العميل</h3>

<input id="customerName" placeholder="اسم العميل">

<input id="customerPhone" placeholder="رقم الهاتف">

<input id="orderNumber" placeholder="رقم الطلب">

</div>

<div class="info-box">

<h3>بيانات الفاتورة</h3>

<p>رقم الفاتورة: <span id="invoiceNo"></span></p>

<p>التاريخ: <span id="todayDate"></span></p>

</div>

</div>

<div class="service-box">

<h3>إضافة خدمة</h3>

<div class="form-grid">

<input id="service" placeholder="تفاصيل العمل">

<input id="thickness" placeholder="السماكة">

<input id="qty" type="number" placeholder="الكمية">

<input id="price" type="number" placeholder="سعر الوحدة">

</div>

<button class="add-btn" onclick="addItem()">
إضافة للخدمة
</button>
<table>

<thead>

<tr>

<th>م</th>
<th>تفاصيل العمل</th>
<th>السماكة</th>
<th>الكمية</th>
<th>سعر الوحدة</th>
<th>الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceRows">

</tbody>

</table>

<div class="total-box">

الإجمالي النهائي:
<span id="grandTotal">0.000</span>
د.ك

</div>

<div class="actions">

<button class="print-btn" onclick="window.print()">
طباعة
</button>

<button class="pdf-btn" onclick="window.print()">
حفظ PDF
</button>

<button class="whatsapp-btn" onclick="sendWhatsApp()">
واتساب
</button>

</div>

<div class="footer">

📍 الكويت – الري – مقابل سوبر ستيل
<br>
📞 96765547
<br>
📧 pro.design.q8@gmail.com

</div>

</div>

</div>

<script>

let grandTotal = 0;
let rowNumber = 1;

document.getElementById("invoiceNo").innerText =
"INV-" + Date.now();

document.getElementById("todayDate").innerText =
new Date().toLocaleDateString("en-GB");

function addItem(){

const service =
document.getElementById("service").value;

const thickness =
document.getElementById("thickness").value;

const qty =
Number(document.getElementById("qty").value);

const price =
Number(document.getElementById("price").value);

if(!service || qty<=0 || price<=0){

alert("أدخل البيانات كاملة");

return;

}

const total = qty * price;

grandTotal += total;

document.getElementById("invoiceRows").innerHTML += `

<tr>

<td>${rowNumber}</td>

<td>${service}</td>

<td>${thickness}</td>

<td>${qty}</td>

<td>${price.toFixed(3)}</td>

<td>${total.toFixed(3)}</td>

</tr>

`;

document.getElementById("grandTotal").innerText =
grandTotal.toFixed(3);

rowNumber++;

document.getElementById("service").value="";
document.getElementById("thickness").value="";
document.getElementById("qty").value="";
document.getElementById("price").value="";

}

function sendWhatsApp(){

const customer =
document.getElementById("customerName").value;

const phone =
document.getElementById("customerPhone").value;

const total =
document.getElementById("grandTotal").innerText;

const msg =
`فاتورة PRO DESIGN
العميل: ${customer}
رقم الطلب: ${document.getElementById("orderNumber").value}
الإجمالي: ${total} د.ك`;

window.open(
`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
"_blank"
);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كاشير PRO DESIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f3f3f3;
}

.topbar{
background:#001a5c;
padding:25px;
text-align:center;
}

.logo{
color:#ff6200;
font-size:40px;
font-weight:900;
margin-bottom:15px;
}

#search{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:20px;
}

.categories{
display:flex;
gap:10px;
overflow:auto;
padding:15px;
background:white;
}

.categories button{
border:none;
background:#001a5c;
color:white;
padding:12px 20px;
border-radius:12px;
font-size:18px;
cursor:pointer;
white-space:nowrap;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.product h3{
font-size:28px;
margin-bottom:10px;
}

.product p{
font-size:30px;
font-weight:900;
color:#ff6200;
margin-bottom:15px;
}

.qty{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:15px;
}

.qty button{
width:50px;
height:50px;
border:none;
background:#001a5c;
color:white;
font-size:25px;
border-radius:12px;
cursor:pointer;
}

.qty span{
font-size:28px;
font-weight:900;
}

.add-btn{
width:100%;
padding:15px;
border:none;
background:#ff6200;
color:white;
font-size:24px;
font-weight:700;
border-radius:15px;
cursor:pointer;
}

.cart{
background:white;
padding:25px;
margin:20px;
border-radius:20px;
}

.cart h2{
font-size:40px;
margin-bottom:20px;
}

#cart-items div{
padding:10px 0;
font-size:22px;
border-bottom:1px solid #eee;
}

.total{
font-size:45px;
font-weight:900;
color:#001a5c;
margin-top:20px;
}

.print-btn{
width:100%;
margin-top:20px;
padding:20px;
border:none;
background:#28a745;
color:white;
font-size:30px;
font-weight:900;
border-radius:15px;
cursor:pointer;
}

</style>

</head>

<body>

<header class="topbar">

<div class="logo">
PRO DESIGN
</div>

<input type="text" id="search" placeholder="ابحث عن خدمة...">

</header>

<section class="categories">

<button onclick="filterCategory('all')">الكل</button>
<button onclick="filterCategory('cnc')">CNC</button>
<button onclick="filterCategory('aluminum')">ألمنيوم</button>
<button onclick="filterCategory('cladding')">كلادنج</button>

</section>

<section class="products">

<div class="product" data-category="cnc">
<h3>تفريز ألمنيوم ديكور</h3>
<p>20 د.ك</p>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span>1</span>
<button onclick="increase(this)">+</button>
</div>

<button class="add-btn"
onclick="addToCart('تفريز ألمنيوم ديكور',20,this)">
إضافة
</button>
</div>

<div class="product" data-category="aluminum">
<h3>قص ألمنيوم</h3>
<p>10 د.ك</p>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span>1</span>
<button onclick="increase(this)">+</button>
</div>

<button class="add-btn"
onclick="addToCart('قص ألمنيوم',10,this)">
إضافة
</button>
</div>

<div class="product" data-category="aluminum">
<h3>حفر ألمنيوم</h3>
<p>15 د.ك</p>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span>1</span>
<button onclick="increase(this)">+</button>
</div>

<button class="add-btn"
onclick="addToCart('حفر ألمنيوم',15,this)">
إضافة
</button>
</div>

<div class="product" data-category="cladding">
<h3>قص كلادنج</h3>
<p>15 د.ك</p>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span>1</span>
<button onclick="increase(this)">+</button>
</div>

<button class="add-btn"
onclick="addToCart('قص كلادنج',15,this)">
إضافة
</button>
</div>

<div class="product" data-category="cladding">
<h3>حفر كلادنج</h3>
<p>20 د.ك</p>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span>1</span>
<button onclick="increase(this)">+</button>
</div>

<button class="add-btn"
onclick="addToCart('حفر كلادنج',20,this)">
إضافة
</button>
</div>

</section>

<section class="cart">

<h2>الفاتورة</h2>

<div id="cart-items"></div>

<div class="total">
الإجمالي:
<span id="total">0</span>
د.ك
</div>

<button class="print-btn" onclick="window.print()">
طباعة الفاتورة
</button>

</section>

<script>

let total=0;

function increase(btn){
let span=btn.parentElement.querySelector("span");
span.innerText=parseInt(span.innerText)+1;
}

function decrease(btn){
let span=btn.parentElement.querySelector("span");
if(parseInt(span.innerText)>1){
span.innerText=parseInt(span.innerText)-1;
}
}

function addToCart(name,price,btn){

let qty=parseInt(
btn.parentElement.querySelector("span").innerText
);

let itemTotal=qty*price;

document.getElementById("cart-items").innerHTML+=
`<div>${name} × ${qty} = ${itemTotal} د.ك</div>`;

total+=itemTotal;

document.getElementById("total").innerText=total;
}

function filterCategory(cat){

let items=document.querySelectorAll(".product");

items.forEach(item=>{

if(cat==="all"){
item.style.display="block";
}
else{
item.style.display=
item.dataset.category===cat
? "block"
: "none";
}

});

}

</script>

</body>
</html>

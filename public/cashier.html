<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كاشير PRO DESIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f3f3f3;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:#001b5e;
color:#fff;
padding:25px;
border-radius:20px;
text-align:center;
font-size:36px;
font-weight:900;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:700;
color:#001b5e;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:18px;
}

button{
border:none;
cursor:pointer;
}

.add-btn{
background:#ff6600;
color:#fff;
padding:14px;
width:100%;
border-radius:12px;
font-size:18px;
font-weight:700;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#001b5e;
color:#fff;
padding:12px;
}

td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

.client-info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-bottom:15px;
}

.total-box{
margin-top:20px;
background:#001b5e;
color:#fff;
padding:20px;
border-radius:15px;
font-size:30px;
font-weight:900;
text-align:center;
}

.print-btn{
margin-top:20px;
background:#22aa44;
color:white;
padding:15px;
width:100%;
font-size:22px;
font-weight:700;
border-radius:15px;
}

.footer{
margin-top:15px;
text-align:center;
font-size:18px;
color:#666;
}

@media print{

body{
padding:0;
background:#fff;
}

.add-btn,
.print-btn{
display:none;
}

.card{
box-shadow:none;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
PRO DESIGN - نظام الكاشير
</div>

<div class="card">

<div class="title">
بيانات العميل
</div>

<div class="client-info">

<input
type="text"
id="customerName"
placeholder="اسم العميل">

<input
type="text"
id="customerPhone"
placeholder="رقم الهاتف">

<input
type="text"
id="orderNumber"
placeholder="رقم الطلب">

</div>

</div>

<div class="card">

<div class="title">
إضافة خدمة جديدة
</div>

<div class="grid">

<input
type="text"
id="service"
placeholder="الخدمة">

<input
type="text"
id="material"
placeholder="المادة">

<input
type="text"
id="thickness"
placeholder="السماكة">

<input
type="number"
id="qty"
placeholder="الكمية">

<input
type="number"
id="price"
placeholder="سعر الوحدة">

</div>

<button
class="add-btn"
onclick="addItem()">

إضافة للفاتورة

</button>

</div>

<div class="card">

<div class="title">
الفاتورة
</div>

<div id="clientData">

<p><b>اسم العميل:</b> <span id="showCustomerName"></span></p>

<p><b>رقم الهاتف:</b> <span id="showCustomerPhone"></span></p>

<p><b>رقم الطلب:</b> <span id="showOrderNumber"></span></p>

</div>

<table>

<thead>

<tr>

<th>م</th>
<th>الخدمة</th>
<th>المادة</th>
<th>السماكة</th>
<th>الكمية</th>
<th>السعر</th>
<th>الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceRows">
</tbody>

</table>

<div class="total-box">

الإجمالي النهائي:
<span id="grandTotal">0.000</span>
د.ك

</div>

<button class="print-btn" onclick="window.print()">
طباعة الفاتورة
</button>

<div class="footer">

📍 الكويت – الري – مقابل سوبر ستيل
<br>
📞 96765547

</div>

</div>

</div>

<script>

let grandTotal = 0;
let rowNumber = 1;

function addItem(){

document.getElementById("showCustomerName").innerText =
document.getElementById("customerName").value;

document.getElementById("showCustomerPhone").innerText =
document.getElementById("customerPhone").value;

document.getElementById("showOrderNumber").innerText =
document.getElementById("orderNumber").value;

let service =
document.getElementById("service").value;

let material =
document.getElementById("material").value;

let thickness =
document.getElementById("thickness").value;

let qty =
Number(document.getElementById("qty").value);

let price =
Number(document.getElementById("price").value);

if(!service || qty <= 0 || price <= 0){

alert("أدخل البيانات كاملة");

return;

}

let total = qty * price;

grandTotal += total;

document.getElementById("invoiceRows").innerHTML += `

<tr>

<td>${rowNumber}</td>

<td>${service}</td>

<td>${material}</td>

<td>${thickness}</td>

<td>${qty}</td>

<td>${price.toFixed(3)}</td>

<td>${total.toFixed(3)}</td>

</tr>

`;

document.getElementById("grandTotal").innerText =
grandTotal.toFixed(3);

rowNumber++;

document.getElementById("service").value = "";
document.getElementById("material").value = "";
document.getElementById("thickness").value = "";
document.getElementById("qty").value = "";
document.getElementById("price").value = "";

}

</script>

</body>
</html>

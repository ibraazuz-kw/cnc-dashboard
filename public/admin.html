<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f3f3f3;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:#00154f;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
font-size:35px;
color:#ff6600;
}

.card p{
font-size:18px;
font-weight:bold;
margin-top:10px;
}

.table-box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#00154f;
color:white;
padding:12px;
}

td{
padding:12px;
border:1px solid #eee;
text-align:center;
}

.open-btn{
background:#ff6600;
color:white;
border:none;
padding:8px 15px;
border-radius:10px;
cursor:pointer;
}

.nav{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-bottom:20px;
}

.nav button{
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
}

.client{
background:#1877f2;
}

.designer{
background:#7a42d1;
}

.factory{
background:#28a745;
}

.invoice{
background:#ff6600;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>📊 لوحة إدارة PRO DESIGN</h1>

</div>

<div class="nav">

<button class="client"
onclick="location.href='client.html'">
العملاء
</button>

<button class="designer"
onclick="location.href='designer.html'">
المصمم
</button>

<button class="factory"
onclick="location.href='factory.html'">
المصنع
</button>

<button class="invoice"
onclick="location.href='invoice.html'">
الفواتير
</button>

</div>

<div class="cards">

<div class="card">
<h2 id="ordersCount">0</h2>
<p>إجمالي الطلبات</p>
</div>

<div class="card">
<h2 id="designCount">0</h2>
<p>قيد التصميم</p>
</div>

<div class="card">
<h2 id="factoryCount">0</h2>
<p>قيد التصنيع</p>
</div>

<div class="card">
<h2 id="doneCount">0</h2>
<p>جاهز للتسليم</p>
</div>

</div>

<div class="table-box">

<table>

<thead>

<tr>
<th>رقم الطلب</th>
<th>العميل</th>
<th>الحالة</th>
<th>فتح</th>
</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

</div>

<script src="data.js"></script>

<script>

let table='';

let design=0;
let factory=0;
let done=0;

orders.forEach(order=>{

if(order.status==="قيد التصميم")
design++;

if(order.status==="قيد التصنيع")
factory++;

if(order.status==="جاهز للتسليم")
done++;

table+=`

<tr>

<td>${order.id}</td>

<td>${order.company}</td>

<td>${order.status}</td>

<td>

<button
class="open-btn"
onclick="viewOrder(${order.id})">

فتح

</button>

</td>

</tr>

`;

});

document.getElementById("ordersTable").innerHTML=table;

document.getElementById("ordersCount").innerText=orders.length;

document.getElementById("designCount").innerText=design;

document.getElementById("factoryCount").innerText=factory;

document.getElementById("doneCount").innerText=done;

function viewOrder(id){

localStorage.setItem(
"selectedOrder",
id
);

alert("تم فتح الطلب رقم " + id);

}

</script>

</body>
</html>

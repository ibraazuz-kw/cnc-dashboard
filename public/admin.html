<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#efefef;
padding:20px;
}

.header{
background:#001446;
color:#fff;
padding:35px;
text-align:center;
font-size:42px;
font-weight:900;
border-radius:30px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:40px;
border-radius:30px;
margin-bottom:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:45px;
font-weight:900;
color:#001446;
margin-bottom:20px;
}

.text{
font-size:26px;
line-height:2;
}

.btn{
display:inline-block;
background:#ff6600;
color:#fff;
padding:18px 45px;
border-radius:20px;
font-size:26px;
font-weight:700;
margin-top:20px;
text-decoration:none;
}

@media(max-width:768px){

.header{
font-size:28px;
}

.title{
font-size:34px;
}

.text{
font-size:22px;
}

.btn{
width:100%;
text-align:center;
}

}

</style>
</head>

<body>

<div class="header">
لوحة إدارة PRO DESIGN
</div>

<div class="card">
<div class="title">الفواتير</div>

<div class="text">
فتح صفحة الفاتورة والطباعة والحفظ PDF
</div>

<a href="invoice.html" class="btn">
فتح الفاتورة
</a>

</div>

<div class="card">
<div class="title">العملاء</div>

<div class="text">
عرض بيانات العملاء والمشاريع
</div>

<a href="client.html" class="btn">
صفحة العميل
</a>

</div>

<div class="card">
<div class="title">المصنع</div>

<div class="text">
متابعة التصنيع والطلبات
</div>

<a href="factory.html" class="btn">
المصنع
</a>

</div>

<div class="card">
<div class="title">المصمم</div>

<div class="text">
متابعة التصاميم والاعتمادات
</div>

<a href="designer.html" class="btn">
المصمم
</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f1f1f1;
padding:20px;
}

.dashboard{
max-width:1200px;
margin:auto;
}

.header{
background:#071127;
color:#fff;
padding:21px;
border-radius:18px;
margin-bottom:20px;
}

.header h1{
font-size:32px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.card h2{
margin-bottom:15px;
color:#071127;
}

.btn{
display:inline-block;
background:#ff5a00;
color:#fff;
padding:12px 22px;
border-radius:12px;
text-decoration:none;
font-weight:700;
margin-top:10px;
}

</style>
</head>
<body>

<div class="dashboard">

<div class="header">
<h1>لوحة إدارة PRO DESIGN</h1>
</div>

<div class="cards">

<div class="card">
<h2>الفواتير</h2>
<p>فتح صفحة الفاتورة والطباعة والحفظ PDF</p>
<a href="invoice.html" target="_blank" class="btn">
فتح الفاتورة
</a>
</div>

<div class="card">
<h2>العملاء</h2>
<p>عرض بيانات العملاء والمشاريع</p>
<a href="client.html" class="btn">
صفحة العميل
</a>
</div>

<div class="card">
<h2>المصنع</h2>
<p>متابعة التصنيع والطلبات</p>
<a href="factory.html" class="btn">
المصنع
</a>
</div>

<div class="card">
<h2>المصمم</h2>
<p>متابعة التصاميم والموافقات</p>
<a href="designer.html" class="btn">
المصمم
</a>
</div>

</div>

</div>

</body>
</html>

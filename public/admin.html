<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.header{
background:#001446;
color:#fff;
padding:30px;
font-size:40px;
font-weight:bold;
border-radius:25px;
text-align:center;
margin-bottom:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:25px;
margin-bottom:25px;
}

.title{
font-size:35px;
font-weight:bold;
margin-bottom:20px;
color:#001446;
}

input,
textarea,
select{

width:100%;
padding:18px;
margin-bottom:15px;
border-radius:18px;
border:1px solid #ccc;
font-size:20px;

}

button{

width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#ff6600;
color:#fff;
font-size:25px;
font-weight:bold;

}

.project{

background:#f7f7f7;
padding:20px;
border-radius:20px;
margin-top:20px;

}

.project h2{
color:#001446;
margin-bottom:10px;
}

.status{

display:inline-block;
padding:10px 20px;
background:green;
color:#fff;
border-radius:15px;
margin-top:15px;

}

.row{

display:flex;
gap:10px;
margin-top:20px;

}

.small{

flex:1;
padding:15px;
font-size:18px;

}

.blue{
background:#2563eb;
}

.red{
background:#dc2626;
}

.green{
background:#16a34a;
}

.orange{
background:#ff6600;
}

</style>

</head>

<body>

<div class="header">
لوحة إدارة PRO DESIGN
</div>

<div class="card">

<div class="title">
إضافة عميل جديد
</div>

<input id="company" placeholder="اسم الشركة">

<input id="username" placeholder="اسم المستخدم">

<input id="password" placeholder="كلمة المرور">

<input id="phone" placeholder="رقم الهاتف">

<textarea id="details" placeholder="تفاصيل المشروع"></textarea>

<select id="status">

<option>بانتظار التصميم</option>
<option>قيد التصميم</option>
<option>بانتظار الاعتماد</option>
<option>قيد التصنيع</option>
<option>تم التسليم</option>

</select>

<button onclick="addProject()">
إضافة المشروع
</button>

</div>

<div class="card">

<div class="title">
المشاريع الحالية
</div>

<div id="projects"></div>

</div>

<script>

loadProjects();

function addProject(){

const company =
document.getElementById("company").value;

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const phone =
document.getElementById("phone").value;

const details =
document.getElementById("details").value;

const status =
document.getElementById("status").value;

if(company==""){
alert("أدخل اسم الشركة");
return;
}

const project = {

company,
username,
password,
phone,
details,
status

};

let projects =
JSON.parse(localStorage.getItem("projects"))
|| [];

projects.unshift(project);

localStorage.setItem(
"projects",
JSON.stringify(projects)
);

loadProjects();

clearInputs();

}

function loadProjects(){

const container =
document.getElementById("projects");

container.innerHTML="";

let projects =
JSON.parse(localStorage.getItem("projects"))
|| [];

projects.forEach((p,index)=>{

container.innerHTML += `

<div class="project">

<h2>${p.company}</h2>

<p>👤 ${p.username}</p>

<p>📞 ${p.phone}</p>

<p>📝 ${p.details}</p>

<div class="status">
${p.status}
</div>

<div class="row">

<button class="small blue"
onclick="editProject(${index})">

تعديل

</button>

<button class="small red"
onclick="deleteProject(${index})">

حذف

</button>

</div>

<div class="row">

<button class="small green"
onclick="sendFactory(${index})">

إرسال للمصنع

</button>

<button class="small orange">

فاتورة

</button>

</div>

</div>

`;

});

}

function deleteProject(index){

let projects =
JSON.parse(localStorage.getItem("projects"))
|| [];

projects.splice(index,1);

localStorage.setItem(
"projects",
JSON.stringify(projects)
);

loadProjects();

}

function editProject(index){

let projects =
JSON.parse(localStorage.getItem("projects"))
|| [];

const p = projects[index];

document.getElementById("company").value =
p.company;

document.getElementById("username").value =
p.username;

document.getElementById("password").value =
p.password;

document.getElementById("phone").value =
p.phone;

document.getElementById("details").value =
p.details;

document.getElementById("status").value =
p.status;

deleteProject(index);

}

function sendFactory(index){

let projects =
JSON.parse(localStorage.getItem("projects"))
|| [];

projects[index].status =
"قيد التصنيع";

localStorage.setItem(
"projects",
JSON.stringify(projects)
);

loadProjects();

alert("تم الإرسال للمصنع");

}

function clearInputs(){

document.getElementById("company").value="";
document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("phone").value="";
document.getElementById("details").value="";

}

</script>

</body>
</html>

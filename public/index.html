<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Design CNC</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#0b1e2d;
  color:#fff;
}

.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}

h2{
  text-align:center;
}

.card{
  background:#112b3c;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input, textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-size:16px;
}

.primary{
  background:#2f80ed;
  color:#fff;
}

.type-buttons button{
  width:32%;
  background:#1e3a4d;
  color:#fff;
}

.active{
  background:#2f80ed !important;
}

canvas{
  background:#0e2433;
  border-radius:10px;
  margin-top:10px;
}

.lock-box{
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚀 Pro Design CNC</h2>

<div class="card">

<!-- نوع الباب -->
<div class="type-buttons">
  <button onclick="setDoorType('single')" id="btn_single">باب</button>
  <button onclick="setDoorType('double')" id="btn_double">بابين</button>
  <button onclick="setDoorType('onehalf')" id="btn_onehalf">باب وربع</button>
</div>

<!-- الرسم -->
<canvas id="doorCanvas" width="260" height="200"></canvas>

<!-- القفل -->
<div id="lockBox" class="lock-box" style="display:none;">
  🔐 مكان القفل:
  <label><input type="radio" name="lock" value="right"> يمين</label>
  <label><input type="radio" name="lock" value="left"> يسار</label>
</div>

<!-- القياسات -->
<p>📏 المقاس الداخلي</p>
<input id="in_w" placeholder="العرض">
<input id="in_h" placeholder="الارتفاع">

<p>📏 المقاس الخارجي</p>
<input id="out_w" placeholder="العرض">
<input id="out_h" placeholder="الارتفاع">

<!-- التفاصيل -->
<textarea id="details" placeholder="تفاصيل إضافية"></textarea>

<!-- صورة -->
<input type="file" id="imgInput">
<img id="preview" style="width:100%;margin-top:10px;border-radius:10px;display:none;">

<!-- زر -->
<button class="primary" onclick="sendData()">إرسال الطلب</button>

</div>
</div>

<script>

let doorType = "single";
let ctx = document.getElementById("doorCanvas").getContext("2d");

function setDoorType(type){
  doorType = type;

  document.getElementById("lockBox").style.display =
    (type === "double") ? "block" : "none";

  document.querySelectorAll(".type-buttons button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn_"+type).classList.add("active");

  drawDoor();
}

function drawDoor(){
  ctx.clearRect(0,0,260,200);

  if(doorType==="single"){
    ctx.strokeRect(80,20,100,160);
    ctx.beginPath();
    ctx.moveTo(80,100);
    ctx.lineTo(180,20);
    ctx.moveTo(80,100);
    ctx.lineTo(180,180);
    ctx.stroke();
  }

  if(doorType==="double"){
    // يسار
    ctx.strokeRect(20,20,90,160);
    ctx.beginPath();
    ctx.moveTo(110,100);
    ctx.lineTo(20,20);
    ctx.moveTo(110,100);
    ctx.lineTo(20,180);
    ctx.stroke();

    // يمين
    ctx.strokeRect(150,20,90,160);
    ctx.beginPath();
    ctx.moveTo(150,100);
    ctx.lineTo(240,20);
    ctx.moveTo(150,100);
    ctx.lineTo(240,180);
    ctx.stroke();
  }

  if(doorType==="onehalf"){
    ctx.strokeRect(20,20,70,160);
    ctx.strokeRect(100,20,140,160);

    ctx.beginPath();
    ctx.moveTo(100,100);
    ctx.lineTo(240,20);
    ctx.moveTo(100,100);
    ctx.lineTo(240,180);
    ctx.stroke();
  }
}

// صورة
document.getElementById("imgInput").addEventListener("change", function(e){
  let file = e.target.files[0];
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display = "block";
  }
  reader.readAsDataURL(file);
});

// إرسال
function sendData(){
  let text = `
طلب CNC:

نوع الباب: ${doorType}

المقاس الداخلي:
${in_w.value} × ${in_h.value}

المقاس الخارجي:
${out_w.value} × ${out_h.value}

القفل: ${document.querySelector('input[name="lock"]:checked')?.value || "-"}

تفاصيل:
${details.value}
`;

  alert(text);
}

// تشغيل أولي
setDoorType("single");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pro Design CNC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#0b1e2d;
  font-family:Tahoma;
  color:#fff;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
}

.card{
  background:#132b3c;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-size:16px;
}

.btn{
  background:#2d6cdf;
  color:#fff;
}

.green{background:#28a745;}
.whatsapp{background:#25D366;}

.preview{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

.canvas-box{
  background:#fff;
  border-radius:10px;
  padding:10px;
  text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h2>🚀 طلب CNC - Pro Design</h2>

<div class="card">

<label>نوع الباب</label>
<select id="doorType" onchange="drawDoor()">
<option value="single">باب مفرد</option>
<option value="double">بابين</option>
<option value="onehalf">باب وربع</option>
</select>

<label>المقاس الداخلي (عرض × ارتفاع)</label>
<input id="in_w" placeholder="100">
<input id="in_h" placeholder="220">

<label>المقاس الخارجي</label>
<input id="out_w" placeholder="98">
<input id="out_h" placeholder="218">

<label>القفل</label>
<select id="lock">
<option>يمين</option>
<option>يسار</option>
</select>

<label>التفاصيل</label>
<textarea id="details"></textarea>

<label>صورة الباب</label>
<input type="file" onchange="previewImage(event)">
<img id="preview" class="preview"/>

</div>

<div class="card canvas-box">
<canvas id="doorCanvas" width="300" height="200"></canvas>
</div>

<button class="btn" onclick="generatePDF()">📄 إنشاء PDF</button>
<button class="green" onclick="saveOrder()">💾 حفظ الطلب</button>
<button class="whatsapp" onclick="sendWhatsApp()">📲 واتساب</button>

<div id="ordersList"></div>

</div>

<!-- PDF -->
<div id="pdfContent" style="display:none; direction:rtl; font-family:Tahoma; padding:20px; background:#fff; color:#000;">

<h2 style="text-align:center;">Pro Design CNC</h2>
<hr>

<p><b>رقم الطلب:</b> <span id="pdf_id"></span></p>
<p><b>نوع الباب:</b> <span id="pdf_type"></span></p>
<p><b>المقاس الداخلي:</b> <span id="pdf_in"></span></p>
<p><b>المقاس الخارجي:</b> <span id="pdf_out"></span></p>
<p><b>القفل:</b> <span id="pdf_lock"></span></p>

<h3>اتجاه الباب</h3>
<canvas id="pdfCanvas" width="300" height="200"></canvas>

<p><b>التفاصيل:</b></p>
<p id="pdf_details"></p>

<img id="pdf_img" style="width:100%; margin-top:10px;">

</div>

<script>

let doorType = "single";

function previewImage(e){
  let reader = new FileReader();
  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
  }
  reader.readAsDataURL(e.target.files[0]);
}

function drawDoor(){
  doorType = document.getElementById("doorType").value;
  let c = document.getElementById("doorCanvas");
  let ctx = c.getContext("2d");

  ctx.clearRect(0,0,300,200);
  ctx.strokeStyle="#000";

  if(doorType==="single"){
    ctx.strokeRect(100,20,100,160);
    ctx.beginPath();
    ctx.moveTo(100,100);
    ctx.lineTo(200,20);
    ctx.moveTo(100,100);
    ctx.lineTo(200,180);
    ctx.stroke();
  }

  if(doorType==="double"){
    ctx.strokeRect(20,20,100,160);
    ctx.strokeRect(180,20,100,160);

    ctx.beginPath();
    ctx.moveTo(120,100);
    ctx.lineTo(20,20);
    ctx.moveTo(120,100);
    ctx.lineTo(20,180);

    ctx.moveTo(180,100);
    ctx.lineTo(280,20);
    ctx.moveTo(180,100);
    ctx.lineTo(280,180);
    ctx.stroke();
  }

  if(doorType==="onehalf"){
    ctx.strokeRect(20,20,80,160);
    ctx.strokeRect(110,20,170,160);

    ctx.beginPath();
    ctx.moveTo(110,100);
    ctx.lineTo(280,20);
    ctx.moveTo(110,100);
    ctx.lineTo(280,180);
    ctx.stroke();
  }
}

drawDoor();

function generatePDF(){

  let id="PD-"+Date.now();

  document.getElementById("pdf_id").innerText=id;
  document.getElementById("pdf_type").innerText=doorType;
  document.getElementById("pdf_in").innerText=in_w.value+"×"+in_h.value;
  document.getElementById("pdf_out").innerText=out_w.value+"×"+out_h.value;
  document.getElementById("pdf_lock").innerText=lock.value;
  document.getElementById("pdf_details").innerText=details.value;

  let preview=document.getElementById("preview").src;
  if(preview) document.getElementById("pdf_img").src=preview;

  let c=document.getElementById("pdfCanvas");
  let ctx=c.getContext("2d");
  ctx.clearRect(0,0,300,200);

  drawDoorToCanvas(ctx);

  let el=document.getElementById("pdfContent");
  el.style.display="block";

  html2canvas(el).then(canvas=>{
    const { jsPDF } = window.jspdf;
    let pdf=new jsPDF();
    let img=canvas.toDataURL("image/png");

    pdf.addImage(img,"PNG",0,0,210,297);
    pdf.save("ProDesign_Order.pdf");

    el.style.display="none";
  });
}

function drawDoorToCanvas(ctx){

  if(doorType==="single"){
    ctx.strokeRect(100,20,100,160);
  }

  if(doorType==="double"){
    ctx.strokeRect(20,20,100,160);
    ctx.strokeRect(180,20,100,160);
  }

  if(doorType==="onehalf"){
    ctx.strokeRect(20,20,80,160);
    ctx.strokeRect(110,20,170,160);
  }
}

function saveOrder(){

  let orders=JSON.parse(localStorage.getItem("orders")||"[]");

  orders.push({
    id:"PD-"+Date.now(),
    type:doorType
  });

  localStorage.setItem("orders",JSON.stringify(orders));

  alert("تم الحفظ ✅");
}

function sendWhatsApp(){

  let msg=`طلب CNC
نوع الباب: ${doorType}
داخل: ${in_w.value}×${in_h.value}
خارج: ${out_w.value}×${out_h.value}
القفل: ${lock.value}`;

  window.open("https://wa.me/965XXXXXXXX?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>

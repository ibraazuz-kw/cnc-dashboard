<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRO DESIGN ERP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#010826;
color:white;
padding:20px;
direction:rtl;
text-align:right;
}

.title{
font-size:55px;
font-weight:bold;
text-align:center;
margin-top:20px;
line-height:1.3;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:40px;
}

.stat-box{
background:#07153d;
padding:40px 20px;
border-radius:30px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.stat-box h2{
font-size:45px;
margin-bottom:20px;
}

.stat-box p{
font-size:20px;
}

.search-box{
margin-top:30px;
}

.search-box input{
width:100%;
padding:22px;
border:none;
border-radius:25px;
background:#07153d;
color:white;
font-size:22px;
}

.filter{
margin-top:20px;
}

.filter select{
width:100%;
padding:22px;
border:none;
border-radius:25px;
background:#07153d;
color:white;
font-size:22px;
}

.add-btn{
width:100%;
padding:28px;
border:none;
border-radius:30px;
background:#3564f0;
color:white;
font-size:34px;
margin-top:25px;
font-weight:bold;
cursor:pointer;
}

.section-title{
font-size:60px;
font-weight:bold;
margin-top:50px;
margin-bottom:30px;
}

.orders{
display:flex;
flex-direction:column;
gap:30px;
}

.card{
background:#07153d;
padding:35px;
border-radius:35px;
border:1px solid rgba(255,255,255,0.06);
}

.status{
display:inline-block;
padding:18px 30px;
border-radius:20px;
font-size:22px;
margin-bottom:30px;
background:#9c6508;
}

.company{
font-size:55px;
font-weight:bold;
margin-bottom:35px;
line-height:1.5;
}

.info{
font-size:28px;
line-height:2;
color:#ddd;
word-break:break-word;
}

.price{
font-size:75px;
font-weight:bold;
color:#11e05d;
margin-top:30px;
text-align:center;
}

.buttons{
display:flex;
gap:20px;
margin-top:35px;
}

.btn{
flex:1;
padding:25px;
border:none;
border-radius:25px;
font-size:28px;
font-weight:bold;
color:white;
cursor:pointer;
}

.edit{
background:#3564f0;
}

.pdf{
background:#13a844;
}

.logout{
width:100%;
padding:28px;
border:none;
border-radius:30px;
background:#eb2020;
color:white;
font-size:40px;
margin-top:50px;
font-weight:bold;
cursor:pointer;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:#07153d;
padding:30px;
border-radius:30px;
width:100%;
max-width:500px;
}

.modal-content h2{
font-size:40px;
margin-bottom:25px;
}

.modal-content input{
width:100%;
padding:22px;
margin-bottom:18px;
border:none;
border-radius:18px;
font-size:22px;
}

.save-btn{
width:100%;
padding:22px;
border:none;
border-radius:20px;
background:#3564f0;
color:white;
font-size:28px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<h1 class="title">
PRO 👑<br>
DESIGN ERP
</h1>

<div class="stats">

<div class="stat-box">
<h2 id="pendingCount">0</h2>
<p>بانتظار الاعتماد</p>
</div>

<div class="stat-box">
<h2 id="allCount">0</h2>
<p>إجمالي الطلبات</p>
</div>

<div class="stat-box">
<h2 id="factoryCount">0</h2>
<p>قيد التصنيع</p>
</div>

<div class="stat-box">
<h2 id="doneCount">0</h2>
<p>تم التسليم</p>
</div>

</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔎 بحث باسم العميل">
</div>

<div class="filter">
<select id="statusFilter">
<option value="all">كل الحالات</option>
<option value="بانتظار الاعتماد">بانتظار الاعتماد</option>
<option value="قيد التصنيع">قيد التصنيع</option>
<option value="تم التسليم">تم التسليم</option>
</select>
</div>

<button class="add-btn" onclick="openModal()">
➕ إضافة طلب
</button>

<h2 class="section-title">
📂 الطلبات الحالية
</h2>

<div class="orders" id="ordersContainer"></div>

<button class="logout" onclick="logout()">
تسجيل خروج
</button>

<div class="modal" id="modal">

<div class="modal-content">

<h2>إضافة طلب</h2>

<input type="text" id="company" placeholder="اسم العميل">
<input type="text" id="design" placeholder="التصميم">
<input type="text" id="sheets" placeholder="عدد الشيتات">
<input type="text" id="size" placeholder="المقاس">
<input type="text" id="price" placeholder="السعر">

<button class="save-btn" onclick="saveOrder()">
حفظ الطلب
</button>

</div>

</div>

<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [

{
company:"PRO DESIGN",
design:"بوابة CNC",
sheets:"5 شيتات",
size:"400 × 220",
price:"780",
status:"قيد التصنيع"
},

{
company:"PRO DESIGN",
design:"باب خارجي مودرن",
sheets:"3 شيت ألمنيوم",
size:"300 × 100",
price:"450",
status:"بانتظار الاعتماد"
}

];

function saveToStorage(){
localStorage.setItem("orders", JSON.stringify(orders));
}

function renderOrders(){

const container = document.getElementById("ordersContainer");

const search =
document.getElementById("searchInput").value;

const filter =
document.getElementById("statusFilter").value;

container.innerHTML = "";

let filtered = orders.filter(order => {

const matchSearch =
order.company.includes(search);

const matchFilter =
filter === "all" || order.status === filter;

return matchSearch && matchFilter;

});

filtered.forEach((order,index)=>{

container.innerHTML += `

<div class="card">

<div class="status">
${order.status}
</div>

<div class="company">
${order.company}
</div>

<div class="info">
📐 التصميم: ${order.design}
</div>

<div class="info">
📦 الشيتات: ${order.sheets}
</div>

<div class="info">
📏 المقاس: ${order.size}
</div>

<div class="price">
KD ${order.price}
</div>

<div class="buttons">

<button class="btn edit"
onclick="editOrder(${index})">
تعديل
</button>

<button class="btn pdf"
onclick="generatePDF()">
فاتورة PDF
</button>

</div>

</div>

`;

});

document.getElementById("allCount").innerText =
orders.length;

document.getElementById("pendingCount").innerText =
orders.filter(o=>o.status==="بانتظار الاعتماد").length;

document.getElementById("factoryCount").innerText =
orders.filter(o=>o.status==="قيد التصنيع").length;

document.getElementById("doneCount").innerText =
orders.filter(o=>o.status==="تم التسليم").length;

}

function openModal(){
document.getElementById("modal").style.display="flex";
}

function saveOrder(){

const company =
document.getElementById("company").value;

const design =
document.getElementById("design").value;

const sheets =
document.getElementById("sheets").value;

const size =
document.getElementById("size").value;

const price =
document.getElementById("price").value;

orders.push({
company,
design,
sheets,
size,
price,
status:"بانتظار الاعتماد"
});

saveToStorage();

renderOrders();

document.getElementById("modal").style.display="none";

}

function editOrder(index){

const newStatus =
prompt(
"الحالة الجديدة:\nبانتظار الاعتماد\nقيد التصنيع\nتم التسليم"
);

if(newStatus){
orders[index].status = newStatus;
saveToStorage();
renderOrders();
}

}

function generatePDF(){
alert("📄 سيتم إنشاء PDF قريباً");
}

function logout(){
window.location.href="login.html";
}

document.getElementById("searchInput")
.addEventListener("input", renderOrders);

document.getElementById("statusFilter")
.addEventListener("change", renderOrders);

renderOrders();

</script>

</body>
</html>

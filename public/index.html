<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PRO DESIGN ERP</title>

<style>

body{
margin:0;
padding:20px;
background:#020826;
font-family:Tahoma;
color:white;
}

h1{
text-align:center;
font-size:55px;
margin-bottom:40px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:35px;
}

.box{
background:#0b1736;
padding:35px 20px;
border-radius:25px;
text-align:center;
font-size:24px;
border:1px solid #1f2d50;
}

.add-btn{
width:100%;
padding:24px;
border:none;
border-radius:20px;
background:#2d63ff;
color:white;
font-size:30px;
margin-bottom:40px;
cursor:pointer;
}

.section-title{
font-size:45px;
font-weight:bold;
margin-bottom:30px;
}

.card{
background:#0b1736;
padding:30px;
border-radius:30px;
margin-bottom:30px;
border:1px solid #1f2d50;
}

.status{
display:inline-block;
padding:14px 24px;
border-radius:18px;
font-size:24px;
margin-bottom:25px;
}

.pending{
background:#9d650f;
}

.design{
background:#2563eb;
}

.production{
background:#d97706;
}

.done{
background:#16a34a;
}

.card h2{
font-size:44px;
margin-bottom:25px;
}

.card p{
font-size:30px;
line-height:2;
color:#ddd;
word-break:break-word;
}

.price{
font-size:60px;
font-weight:bold;
color:#19e66e;
margin-top:30px;
}

.buttons{
display:flex;
gap:15px;
margin-top:30px;
}

.buttons button{
flex:1;
padding:22px;
border:none;
border-radius:18px;
font-size:26px;
color:white;
cursor:pointer;
}

.edit-btn{
background:#2563eb;
}

.pdf-btn{
background:#16a34a;
}

.logout{
width:100%;
padding:24px;
background:#e12626;
border:none;
border-radius:20px;
font-size:30px;
color:white;
margin-top:40px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>
👑 PRO DESIGN ERP
</h1>

<div class="stats">

<div class="box" id="totalOrders">
0
<br><br>
إجمالي الطلبات
</div>

<div class="box" id="pendingOrders">
0
<br><br>
بانتظار الاعتماد
</div>

<div class="box" id="productionOrders">
0
<br><br>
قيد التصنيع
</div>

<div class="box" id="doneOrders">
0
<br><br>
تم التسليم
</div>

</div>

<button class="add-btn"
onclick="addOrder()">

➕ إضافة طلب

</button>

<div class="section-title">
📂 الطلبات الحالية
</div>

<div id="orders"></div>

<button class="logout"
onclick="logout()">

تسجيل خروج

</button>

<script src="data.js"></script>

<script>

const ordersContainer =
document.getElementById("orders");

/* =========================
   Render Orders
========================= */

function renderOrders(){

ordersContainer.innerHTML = "";

orders.forEach(order => {

let statusClass = "pending";

if(order.status === "قيد التصميم"){

statusClass = "design";

}

if(order.status === "قيد التصنيع"){

statusClass = "production";

}

if(order.status === "تم التسليم"){

statusClass = "done";

}

ordersContainer.innerHTML += `

<div class="card">

<div class="status ${statusClass}">
${order.status}
</div>

<h2>
${order.company}
</h2>

<p>
📐 التصميم:
${order.design}
</p>

<p>
📦 الشيتات:
${order.sheets}
</p>

<p>
📏 المقاس:
${order.size}
</p>

<div class="price">
KD ${order.price}
</div>

<div class="buttons">

<button class="edit-btn"
onclick="editOrder(${order.id})">

تعديل

</button>

<button class="pdf-btn"
onclick="pdfOrder(${order.id})">

فاتورة PDF

</button>

</div>

</div>

`;

});

updateStats();

}

/* =========================
   Update Stats
========================= */

function updateStats(){

document.getElementById(
"totalOrders"
).innerHTML =

orders.length
+
"<br><br>إجمالي الطلبات";

document.getElementById(
"pendingOrders"
).innerHTML =

orders.filter(o =>

o.status === "بانتظار الاعتماد"

).length

+

"<br><br>بانتظار الاعتماد";

document.getElementById(
"productionOrders"
).innerHTML =

orders.filter(o =>

o.status === "قيد التصنيع"

).length

+

"<br><br>قيد التصنيع";

document.getElementById(
"doneOrders"
).innerHTML =

orders.filter(o =>

o.status === "تم التسليم"

).length

+

"<br><br>تم التسليم";

}

/* =========================
   Add Order
========================= */

function addOrder(){

const company =
prompt("اسم العميل");

if(!company) return;

const design =
prompt("نوع التصميم");

if(!design) return;

const sheets =
prompt("عدد الشيتات");

if(!sheets) return;

const size =
prompt("المقاس");

if(!size) return;

const price =
prompt("السعر");

if(!price) return;

const newOrder = {

id: Date.now(),

company: company,

design: design,

sheets: sheets,

size: size,

price: price,

status: "بانتظار الاعتماد"

};

orders.push(newOrder);

saveOrders();

renderOrders();

alert("✅ تم إضافة الطلب");

}

/* =========================
   Edit Order
========================= */

function editOrder(id){

alert(
"✏️ صفحة التعديل قريباً"
);

}

/* =========================
   PDF
========================= */

function pdfOrder(id){

alert(
"📄 سيتم إنشاء PDF قريباً"
);

}

/* =========================
   Logout
========================= */

function logout(){

window.location.href =
"/login.html";

}

/* =========================
   Start
========================= */

renderOrders();

</script>

</body>
</html>

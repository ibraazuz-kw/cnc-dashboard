<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pro Design CNC</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:'Cairo',sans-serif;
    background:#0b1e2d;
    color:#fff;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
    background:#112b3c;
    padding:20px;
    border-radius:15px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-weight:bold;
}

.canvasBox{
    background:#0b1e2d;
    border:2px solid #3b82f6;
    border-radius:10px;
    margin-top:10px;
    text-align:center;
}

canvas{
    width:100%;
}

.preview{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚀 طلب CNC - Pro Design</h2>

<select id="type">
<option value="single">باب مفرد</option>
<option value="double">باب دبل</option>
<option value="half">باب وربع</option>
</select>

<input id="w_in" placeholder="عرض داخلي">
<input id="h_in" placeholder="ارتفاع داخلي">

<input id="w_out" placeholder="عرض خارجي">
<input id="h_out" placeholder="ارتفاع خارجي">

<select id="direction">
<option value="right">يمين</option>
<option value="left">يسار</option>
</select>

<select id="lock">
<option value="right">القفل يمين</option>
<option value="left">القفل يسار</option>
</select>

<input id="details" placeholder="تفاصيل">

<input type="file" id="imageInput">

<img id="preview" class="preview"/>

<div class="canvasBox">
<canvas id="draw" height="200"></canvas>
</div>

<button onclick="drawDoor()">تحديث الرسم</button>

<button onclick="makePDF()">📄 إنشاء PDF</button>

</div>

<script>

const canvas = document.getElementById("draw");
const ctx = canvas.getContext("2d");

function drawDoor(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let type = document.getElementById("type").value;
    let dir = document.getElementById("direction").value;
    let lock = document.getElementById("lock").value;

    if(type === "single"){
        drawSingle(dir,lock);
    }

    if(type === "double"){
        drawDouble(lock);
    }

    if(type === "half"){
        drawHalf(dir,lock);
    }
}

function drawSingle(dir,lock){
    ctx.strokeStyle="white";
    ctx.strokeRect(80,20,120,160);

    ctx.beginPath();

    if(dir==="right"){
        ctx.moveTo(80,100);
        ctx.lineTo(200,40);
        ctx.moveTo(80,100);
        ctx.lineTo(200,160);
    }else{
        ctx.moveTo(200,100);
        ctx.lineTo(80,40);
        ctx.moveTo(200,100);
        ctx.lineTo(80,160);
    }

    ctx.stroke();

    // القفل
    ctx.fillStyle="red";
    if(lock==="right"){
        ctx.fillRect(195,95,5,10);
    }else{
        ctx.fillRect(80,95,5,10);
    }
}

function drawDouble(lock){

    // بابين
    ctx.strokeRect(50,20,80,160);
    ctx.strokeRect(130,20,80,160);

    // الأسهم عكس بعض
    ctx.beginPath();

    // يسار
    ctx.moveTo(50,100);
    ctx.lineTo(130,40);
    ctx.moveTo(50,100);
    ctx.lineTo(130,160);

    // يمين
    ctx.moveTo(210,100);
    ctx.lineTo(130,40);
    ctx.moveTo(210,100);
    ctx.lineTo(130,160);

    ctx.stroke();

    // القفل
    ctx.fillStyle="red";
    if(lock==="right"){
        ctx.fillRect(130,95,5,10);
    }else{
        ctx.fillRect(125,95,5,10);
    }
}

function drawHalf(dir,lock){

    // كبير
    ctx.strokeRect(80,20,120,160);
    // ربع
    ctx.strokeRect(40,20,40,160);

    ctx.beginPath();

    if(dir==="right"){
        ctx.moveTo(80,100);
        ctx.lineTo(200,40);
        ctx.moveTo(80,100);
        ctx.lineTo(200,160);
    }else{
        ctx.moveTo(200,100);
        ctx.lineTo(80,40);
        ctx.moveTo(200,100);
        ctx.lineTo(80,160);
    }

    ctx.stroke();

    ctx.fillStyle="red";
    if(lock==="right"){
        ctx.fillRect(195,95,5,10);
    }else{
        ctx.fillRect(80,95,5,10);
    }
}


// صورة
document.getElementById("imageInput").addEventListener("change",function(e){
    const file = e.target.files[0];
    if(file){
        document.getElementById("preview").src = URL.createObjectURL(file);
    }
});


// PDF
function makePDF(){

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    pdf.setFont("Helvetica");

    pdf.text("Pro Design CNC", 80, 15);

    pdf.text("نوع الباب: " + document.getElementById("type").value, 10, 30);
    pdf.text("داخل: " + document.getElementById("w_in").value + " x " + document.getElementById("h_in").value, 10, 40);
    pdf.text("خارج: " + document.getElementById("w_out").value + " x " + document.getElementById("h_out").value, 10, 50);
    pdf.text("الاتجاه: " + document.getElementById("direction").value, 10, 60);
    pdf.text("القفل: " + document.getElementById("lock").value, 10, 70);

    // الرسم
    const img = canvas.toDataURL("image/png");
    pdf.addImage(img,'PNG',10,80,180,80);

    // الصورة
    const preview = document.getElementById("preview");
    if(preview.src){
        pdf.addImage(preview.src,'JPEG',10,170,180,100);
    }

    pdf.save("ProDesign_Order.pdf");
}

</script>

</body>
</html>

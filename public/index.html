<script>

let orders = [

{
client:"شركة باب السيف",
design:"باب خارجي مودرن",
sheets:"3 شيت ألمنيوم",
size:"300 × 100",
price:"450 KD",
status:"بانتظار الاعتماد",
statusClass:"pending"
},

{
client:"شركة الهاجري",
design:"بوابة CNC",
sheets:"5 شيتات",
size:"400 × 220",
price:"780 KD",
status:"قيد التصنيع",
statusClass:"production"
}

];

/* =========================
   Render Orders
========================= */

function renderOrders(){

const container =
document.querySelector(".orders");

container.innerHTML = "";

orders.forEach((order,index)=>{

container.innerHTML += `

<div class="order">

<div class="order-top">

<div class="client">
${order.client}
</div>

<div class="status ${order.statusClass}">
${order.status}
</div>

</div>

<div class="order-info">

📐 التصميم:
${order.design}

<br>

📦 الشيتات:
${order.sheets}

<br>

📏 المقاس:
${order.size}

</div>

<div class="price">
KD ${order.price}
</div>

<div class="buttons">

<button
class="edit"
onclick="editOrder(${index})"
>

تعديل

</button>

<button
class="invoice"
onclick="downloadInvoice()"
>

فاتورة PDF

</button>

</div>

</div>

`;

});

updateStats();

}

/* =========================
   Stats
========================= */

function updateStats(){

document.querySelectorAll(".card h2")[0]
.innerText = orders.length;

}

/* =========================
   Open Modal
========================= */

function openModal(){

document.getElementById("modal")
.style.display = "flex";

}

/* =========================
   Close Modal
========================= */

window.onclick = function(e){

const modal =
document.getElementById("modal");

if(e.target == modal){

modal.style.display = "none";

}

}

/* =========================
   Save Order
========================= */

function saveOrder(){

const inputs =
document.querySelectorAll(".modal-box input");

const selects =
document.querySelectorAll(".modal-box select");

const client =
inputs[0].value;

const design =
inputs[1].value;

const price =
inputs[2].value;

const status =
selects[0].value;

if(
client == "" ||
design == "" ||
price == ""
){

alert("❌ عبّ جميع البيانات");

return;

}

let statusClass = "pending";

if(status == "قيد التصنيع"){

statusClass = "production";

}

if(status == "تم التسليم"){

statusClass = "done";

}

orders.push({

client:client,
design:design,
sheets:"غير محدد",
size:"غير محدد",
price:price,
status:status,
statusClass:statusClass

});

renderOrders();

document.getElementById("modal")
.style.display = "none";

inputs[0].value = "";
inputs[1].value = "";
inputs[2].value = "";

alert("✅ تم إضافة الطلب");

}

/* =========================
   Edit
========================= */

function editOrder(index){

alert(
"🚧 تعديل الطلب رقم "
+
(index + 1)
);

}

/* =========================
   Invoice
========================= */

function downloadInvoice(){

alert(
"📄 سيتم إنشاء PDF قريباً"
);

}

/* =========================
   Logout
========================= */

function logout(){

window.location.href =
"login.html";

}

/* =========================
   Start
========================= */

renderOrders();

</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO DESIGN ERP</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f3f3f3;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.invoice{
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.header{
background:#00154f;
padding:25px;
text-align:center;
}

.logo{
max-width:240px;
height:auto;
}

.title{
padding:25px;
text-align:center;
}

.title h1{
font-size:45px;
color:#00154f;
font-weight:900;
}

.title p{
font-size:22px;
color:#ff6600;
font-weight:bold;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#fff;
border:2px solid #eee;
padding:20px;
border-radius:20px;
}

.card h3{
margin-bottom:15px;
color:#ff6600;
}

.card input{
width:100%;
padding:14px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

.invoice-info{
font-size:18px;
line-height:2.5;
}

.service-box{
padding:20px;
}

.service-box h3{
color:#00154f;
margin-bottom:15px;
}

.service-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.service-grid input{
padding:14px;
border:1px solid #ddd;
border-radius:12px;
}

.add-btn{
width:100%;
margin-top:15px;
padding:16px;
background:#ff6600;
color:white;
border:none;
border-radius:15px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

thead{
background:#00154f;
color:white;
}

th{
padding:14px;
font-size:18px;
}

td{
padding:12px;
border:1px solid #eee;
text-align:center;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.total-box{
margin:25px;
background:#ff6600;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
font-size:34px;
font-weight:900;
}

.actions{
display:flex;
gap:10px;
padding:0 25px 25px;
}

.actions button{
flex:1;
padding:16px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
}

.print-btn{
background:#28a745;
}

.save-btn{
background:#00154f;
}

.whatsapp-btn{
background:#25D366;
}

.footer{
background:#00154f;
color:white;
padding:20px;
text-align:center;
line-height:2;
font-size:18px;
}

@media(max-width:768px){

.info-grid{
grid-template-columns:1fr;
}

.service-grid{
grid-template-columns:1fr;
}

.actions{
flex-direction:column;
}

}

@media print{

.actions,
.service-box{
display:none;
}

body{
background:white;
padding:0;
}

.invoice{
box-shadow:none;
}

}

</style>

</head>

<body>

<div class="container">

<div class="invoice">

<div class="header">

<img
class="logo"
src="file_00000000fd40720abbbe4a62d7158405.jpg">

</div>

<div class="title">

<h1>فاتورة</h1>

<p>PRO DESIGN CNC SYSTEM</p>

</div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pro Design CNC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#0b1e2d;
  font-family:Tahomа;
  color:#fff;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
}

.card{
  background:#132b3c;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

.btn{background:#2d6cdf;color:#fff;}
.green{background:#28a745;}
.whatsapp{background:#25D366;}

.preview{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>🚀 طلب CNC</h2>

<div class="card">

<select id="doorType">
<option value="single">باب مفرد</option>
<option value="double">بابين</option>
<option value="onehalf">باب وربع</option>
</select>

<input id="in_w" placeholder="عرض داخلي">
<input id="in_h" placeholder="ارتفاع داخلي">

<input id="out_w" placeholder="عرض خارجي">
<input id="out_h" placeholder="ارتفاع خارجي">

<select id="lock">
<option>يمين</option>
<option>يسار</option>
</select>

<textarea id="details" placeholder="تفاصيل"></textarea>

<input type="file" onchange="previewImage(event)">
<img id="preview" class="preview"/>

</div>

<button class="btn" onclick="generatePDF()">📄 PDF</button>

</div>

<!-- PDF -->
<div id="pdfContent" style="display:none; direction:rtl; padding:20px; background:#fff; color:#000; font-family:Tahoma;">

<h1 style="text-align:center;">Pro Design CNC</h1>
<hr>

<p><b>رقم الطلب:</b> <span id="pdf_id"></span></p>
<p><b>نوع الباب:</b> <span id="pdf_type"></span></p>
<p><b>الداخل:</b> <span id="pdf_in"></span></p>
<p><b>الخارج:</b> <span id="pdf_out"></span></p>
<p><b>القفل:</b> <span id="pdf_lock"></span></p>

<h3>اتجاه الباب</h3>
<canvas id="pdfCanvas" width="400" height="200" style="border:1px solid #ccc;"></canvas>

<h3>التفاصيل</h3>
<p id="pdf_details"></p>

<img id="pdf_img" style="width:100%; margin-top:15px; border-radius:10px;">

</div>

<script>

function previewImage(e){
  let reader = new FileReader();
  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
  }
  reader.readAsDataURL(e.target.files[0]);
}

function generatePDF(){

  let type = document.getElementById("doorType").value;
  let lock = document.getElementById("lock").value;

  let id="PD-"+Date.now();

  pdf_id.innerText=id;
  pdf_type.innerText=type;
  pdf_in.innerText=in_w.value+" × "+in_h.value;
  pdf_out.innerText=out_w.value+" × "+out_h.value;
  pdf_lock.innerText=lock;
  pdf_details.innerText=details.value;

  if(preview.src) pdf_img.src=preview.src;

  drawDoor(type,lock);

  let el=document.getElementById("pdfContent");
  el.style.display="block";

  html2canvas(el,{scale:2}).then(canvas=>{
    const { jsPDF } = window.jspdf;
    let pdf=new jsPDF("p","mm","a4");

    let img=canvas.toDataURL("image/png");

    pdf.addImage(img,"PNG",0,0,210,297);
    pdf.save("ProDesign.pdf");

    el.style.display="none";
  });
}

function drawDoor(type,lock){

  let c=document.getElementById("pdfCanvas");
  let ctx=c.getContext("2d");

  ctx.clearRect(0,0,400,200);

  ctx.lineWidth=2;

  if(type==="single"){
    ctx.strokeRect(150,20,100,160);

    ctx.beginPath();

    if(lock==="يمين"){
      ctx.moveTo(150,100);
      ctx.lineTo(250,20);
      ctx.moveTo(150,100);
      ctx.lineTo(250,180);
    }else{
      ctx.moveTo(250,100);
      ctx.lineTo(150,20);
      ctx.moveTo(250,100);
      ctx.lineTo(150,180);
    }

    ctx.stroke();
  }

  if(type==="double"){

    ctx.strokeRect(80,20,100,160);
    ctx.strokeRect(220,20,100,160);

    ctx.beginPath();

    ctx.moveTo(180,100);
    ctx.lineTo(80,20);
    ctx.moveTo(180,100);
    ctx.lineTo(80,180);

    ctx.moveTo(220,100);
    ctx.lineTo(320,20);
    ctx.moveTo(220,100);
    ctx.lineTo(320,180);

    ctx.stroke();
  }

  if(type==="onehalf"){

    ctx.strokeRect(80,20,80,160);
    ctx.strokeRect(170,20,150,160);

    ctx.beginPath();
    ctx.moveTo(170,100);
    ctx.lineTo(320,20);
    ctx.moveTo(170,100);
    ctx.lineTo(320,180);

    ctx.stroke();
  }

}

</script>

</body>
</html>

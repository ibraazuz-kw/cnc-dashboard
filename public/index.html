<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO DESIGN SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f5f5f5;
padding:25px;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo img{
max-width:220px;
height:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-decoration:none;
color:#000;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-top:15px;
font-size:28px;
}

.admin{
border-top:8px solid #ff6600;
}

.client{
border-top:8px solid #007bff;
}

.factory{
border-top:8px solid #28a745;
}

.designer{
border-top:8px solid #6f42c1;
}

.icon{
font-size:60px;
}

</style>

</head>

<body>

<div class="logo">

<img src="file_00000000fd40720abbbe4a62d7158405.jpg" alt="Pro Design">

</div>

<div class="grid">

<a href="invoice.html" class="card admin">
<div class="icon">📊</div>
<h2>الإدارة</h2>
</a>

<a href="client.html" class="card client">
<div class="icon">👤</div>
<h2>العميل</h2>
</a>

<a href="factory.html" class="card factory">
<div class="icon">🏭</div>
<h2>المصنع</h2>
</a>

<a href="designer.html" class="card designer">
<div class="icon">🎨</div>
<h2>المصمم</h2>
</a>

</div>

</body>
</html>

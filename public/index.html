<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO DESIGN ERP</title>

<style>

body{
margin:0;
padding:20px;
background:#020826;
font-family:Tahoma;
color:white;
}

h1{
text-align:center;
font-size:55px;
margin-bottom:40px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:30px;
}

.box{
background:#0b1736;
padding:35px 20px;
border-radius:25px;
text-align:center;
font-size:22px;
border:1px solid #1f2d50;
}

.add-btn{
width:100%;
padding:22px;
border:none;
border-radius:20px;
background:#2d63ff;
color:white;
font-size:28px;
margin-bottom:30px;
cursor:pointer;
}

.section-title{
font-size:42px;
margin-bottom:25px;
font-weight:bold;
}

.card{
background:#0b1736;
padding:25px;
border-radius:30px;
margin-bottom:25px;
border:1px solid #1f2d50;
}

.status{
display:inline-block;
padding:12px 22px;
border-radius:15px;
background:#8d5a10;
font-size:22px;
margin-bottom:20px;
}

.card h2{
font-size:42px;
margin-bottom:25px;
}

.card p{
font-size:28px;
line-height:2;
color:#ddd;
}

.card h3{
font-size:55px;
color:#1dde67;
margin-top:25px;
}

.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.buttons button{
flex:1;
padding:22px;
border:none;
border-radius:18px;
font-size:24px;
color:white;
cursor:pointer;
}

.edit-btn{
background:#2d63ff;
}

.pdf-btn{
background:#16a34a;
}

.logout{
width:100%;
padding:25px;
background:#e61d2b;
border:none;
border-radius:22px;
color:white;
font-size:30px;
margin-top:40px;
cursor:pointer;
}

</style>
</head>

<body>

<h1>👑 PRO DESIGN ERP</h1>

<div class="stats">

<div class="box">
3<br><br>
إجمالي الطلبات
</div>

<div class="box">
1<br><br>
بانتظار الاعتماد
</div>

<div class="box">
1<br><br>
تم التسليم
</div>

<div class="box">
1<br><br>
قيد التصنيع
</div>

</div>

<button class="add-btn" onclick="addOrder()">
➕ إضافة طلب
</button>

<div class="section-title">
📂 الطلبات الحالية
</div>

<div id="orders"></div>

<button class="logout" onclick="logout()">
تسجيل خروج
</button>

<script src="data.js"></script>

<script>

const ordersContainer = document.getElementById("orders");

function renderOrders(){

ordersContainer.innerHTML = "";

orders.forEach(order => {

ordersContainer.innerHTML += `

<div class="card">

<div class="status">
${order.status}
</div>

<h2>
${order.company}
</h2>

<p>
📐 التصميم: ${order.design}
</p>

<p>
📦 الشيتات: ${order.sheets}
</p>

<p>
📏 المقاس: ${order.size}
</p>

<h3>
KD ${order.price}
</h3>

<div class="buttons">

<button class="edit-btn"
onclick="editOrder(${order.id})">
تعديل
</button>

<button class="pdf-btn"
onclick="pdfOrder(${order.id})">
فاتورة PDF
</button>

</div>

</div>

`;

});

}

function addOrder(){

const company = prompt("اسم العميل");
if(!company) return;

const design = prompt("نوع التصميم");
if(!design) return;

const sheets = prompt("عدد الشيتات");
if(!sheets) return;

const size = prompt("المقاس");
if(!size) return;

const price = prompt("السعر");
if(!price) return;

const newOrder = {

id: Date.now(),

company: company,

design: design,

sheets: sheets,

size: size,

price: price,

status: "بانتظار الاعتماد"

};

orders.push(newOrder);

saveOrders();

renderOrders();

alert("✅ تم إضافة الطلب");

}

function editOrder(id){

alert("✏️ صفحة التعديل قريباً");

}

function pdfOrder(id){

alert("📄 سيتم إنشاء PDF قريباً");

}

function logout(){

window.location.href = "/login.html";

}

renderOrders();

</script>

</body>
</html>

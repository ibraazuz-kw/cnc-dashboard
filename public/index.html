<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Design CNC</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo', sans-serif;
  background:#0b1e2d;
  color:#fff;
}
.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}
h2{text-align:center;}
.card{
  background:#112b3c;
  padding:15px;
  border-radius:12px;
}
input, textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:8px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-size:16px;
}
.primary{background:#2f80ed;color:#fff;}
.green{background:#25D366;color:#fff;}
.type-buttons button{
  width:32%;
  background:#1e3a4d;
}
.active{background:#2f80ed !important;}
canvas{
  background:#0e2433;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>🚀 Pro Design CNC</h2>

<div class="card">

<!-- نوع الباب -->
<div class="type-buttons">
<button onclick="setDoorType('single')" id="btn_single">باب</button>
<button onclick="setDoorType('double')" id="btn_double">بابين</button>
<button onclick="setDoorType('onehalf')" id="btn_onehalf">باب وربع</button>
</div>

<!-- الرسم -->
<canvas id="doorCanvas" width="260" height="200"></canvas>

<!-- القفل -->
<div id="lockBox" style="display:none;">
🔐 القفل:
<label><input type="radio" name="lock" value="يمين"> يمين</label>
<label><input type="radio" name="lock" value="يسار"> يسار</label>
</div>

<!-- القياسات -->
<p>📏 الداخلي</p>
<input id="in_w" placeholder="عرض">
<input id="in_h" placeholder="ارتفاع">

<p>📏 الخارجي</p>
<input id="out_w" placeholder="عرض">
<input id="out_h" placeholder="ارتفاع">

<textarea id="details" placeholder="تفاصيل إضافية"></textarea>

<!-- صورة -->
<input type="file" id="imgInput">
<img id="preview" style="width:100%;display:none;margin-top:10px;border-radius:10px;">

<button class="primary" onclick="generatePDF()">تحميل PDF</button>
<button class="green" onclick="sendWhatsApp()">إرسال واتساب</button>

</div>
</div>

<!-- محتوى PDF -->
<div id="pdfContent" style="display:none; direction:rtl; font-family:Cairo; padding:20px; background:#fff; color:#000;">

<h2 style="text-align:center;">Pro Design CNC</h2>
<hr>

<p><b>نوع الباب:</b> <span id="pdf_type"></span></p>
<p><b>المقاس الداخلي:</b> <span id="pdf_in"></span></p>
<p><b>المقاس الخارجي:</b> <span id="pdf_out"></span></p>
<p><b>القفل:</b> <span id="pdf_lock"></span></p>

<p><b>التفاصيل:</b></p>
<p id="pdf_details"></p>

<br>
<img id="pdf_img" style="width:100%; border-radius:10px;">

</div>

<!-- مكتبات -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let doorType="single";
let ctx=document.getElementById("doorCanvas").getContext("2d");

function setDoorType(type){
  doorType=type;

  document.getElementById("lockBox").style.display =
    (type==="double")?"block":"none";

  document.querySelectorAll(".type-buttons button")
    .forEach(b=>b.classList.remove("active"));
  document.getElementById("btn_"+type).classList.add("active");

  drawDoor();
}

function drawDoor(){
  ctx.clearRect(0,0,260,200);

  if(doorType==="single"){
    ctx.strokeRect(80,20,100,160);
    ctx.beginPath();
    ctx.moveTo(80,100);
    ctx.lineTo(180,20);
    ctx.moveTo(80,100);
    ctx.lineTo(180,180);
    ctx.stroke();
  }

  if(doorType==="double"){
    ctx.strokeRect(20,20,90,160);
    ctx.beginPath();
    ctx.moveTo(110,100);
    ctx.lineTo(20,20);
    ctx.moveTo(110,100);
    ctx.lineTo(20,180);
    ctx.stroke();

    ctx.strokeRect(150,20,90,160);
    ctx.beginPath();
    ctx.moveTo(150,100);
    ctx.lineTo(240,20);
    ctx.moveTo(150,100);
    ctx.lineTo(240,180);
    ctx.stroke();
  }

  if(doorType==="onehalf"){
    ctx.strokeRect(20,20,70,160);
    ctx.strokeRect(100,20,140,160);

    ctx.beginPath();
    ctx.moveTo(100,100);
    ctx.lineTo(240,20);
    ctx.moveTo(100,100);
    ctx.lineTo(240,180);
    ctx.stroke();
  }
}

// صورة
document.getElementById("imgInput").addEventListener("change", function(e){
  let file=e.target.files[0];
  let reader=new FileReader();
  reader.onload=function(){
    let img=document.getElementById("preview");
    img.src=reader.result;
    img.style.display="block";
  }
  reader.readAsDataURL(file);
});

// PDF احترافي
async function generatePDF(){

  document.getElementById("pdf_type").innerText = doorType;
  document.getElementById("pdf_in").innerText = in_w.value+" × "+in_h.value;
  document.getElementById("pdf_out").innerText = out_w.value+" × "+out_h.value;
  document.getElementById("pdf_lock").innerText =
    document.querySelector('input[name="lock"]:checked')?.value || "-";
  document.getElementById("pdf_details").innerText = details.value;

  let preview = document.getElementById("preview");
  if(preview.src){
    document.getElementById("pdf_img").src = preview.src;
  }

  let element = document.getElementById("pdfContent");
  element.style.display="block";

  const canvas = await html2canvas(element,{scale:2});
  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;
  let pdf = new jsPDF("p","mm","a4");

  let width=210;
  let height=(canvas.height*width)/canvas.width;

  pdf.addImage(imgData,"PNG",0,0,width,height);
  pdf.save("ProDesign_Order.pdf");

  element.style.display="none";
}

// واتساب
function sendWhatsApp(){
  let phone="96596765547"; // غير الرقم
  let msg="تم إنشاء الطلب، مرفق PDF جاهز";
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg));
}

setDoorType("single");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pro Design CNC</title>

<style>
body {
    font-family: Arial;
    background: #0b1b2b;
    color: white;
    padding: 15px;
}

.card {
    background: #11263c;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #2f6fed;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
}

.small-btn {
    background: #444;
}

</style>
</head>

<body>

<h2>🚀 طلب CNC - Pro Design</h2>

<div id="doors"></div>

<button onclick="addDoor()">➕ إضافة باب</button>

<button onclick="sendData()">📤 إرسال الطلب</button>

<script>

let doorCount = 0;

function addDoor() {

    doorCount++;

    let html = `
    <div class="card">
        <h3>📦 باب ${doorCount}</h3>

        <label>Inside (عرض × ارتفاع)</label>
        <input placeholder="مثال: 100 × 220" class="inside">

        <label>Outside (عرض × ارتفاع)</label>
        <input placeholder="مثال: 98 × 218" class="outside">

        <label>الاتجاه</label>
        <select class="direction">
            <option>يمين</option>
            <option>يسار</option>
        </select>

        <label>تفاصيل إضافية</label>
        <div class="details"></div>

        <button class="small-btn" onclick="addDetail(this)">➕ إضافة تفصيلة</button>

        <label>ملاحظات</label>
        <textarea class="notes"></textarea>
    </div>
    `;

    document.getElementById("doors").insertAdjacentHTML("beforeend", html);
}

function addDetail(btn) {

    let container = btn.previousElementSibling;

    let html = `
    <div class="card">
        <input placeholder="الوصف (مثال: فتحة / زخرفة)">
        <input placeholder="القياس (مثال: 25 × 80)">
    </div>
    `;

    container.insertAdjacentHTML("beforeend", html);
}

function sendData() {

    let doors = document.querySelectorAll(".card");

    let result = "";

    doors.forEach((door, i) => {

        let inside = door.querySelector(".inside")?.value || "";
        let outside = door.querySelector(".outside")?.value || "";
        let direction = door.querySelector(".direction")?.value || "";
        let notes = door.querySelector(".notes")?.value || "";

        result += `باب ${i+1}\n`;
        result += `Inside: ${inside}\n`;
        result += `Outside: ${outside}\n`;
        result += `الاتجاه: ${direction}\n`;

        let details = door.querySelectorAll(".details .card");

        details.forEach(d => {
            let inputs = d.querySelectorAll("input");
            result += `تفصيلة: ${inputs[0].value} - ${inputs[1].value}\n`;
        });

        result += `ملاحظات: ${notes}\n`;
        result += `-------------------\n`;
    });

    alert(result);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pro Design CNC</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#081a26;
  font-family:Tahoma;
  color:#fff;
  padding:20px;
}

.container{
  max-width:420px;
  margin:auto;
}

.card{
  background:#102a3b;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:8px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
}

.btn{background:#2d6cdf;color:#fff;}

.preview{
  width:100%;
  border-radius:10px;
}

.canvas-box{
  background:#fff;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

h2{text-align:center;}
</style>
</head>

<body>

<div class="container">

<h2>🚀 طلب CNC</h2>

<div class="card">

<select id="doorType" onchange="drawDoor()">
<option value="single">باب مفرد</option>
<option value="double">بابين</option>
<option value="onehalf">باب وربع</option>
</select>

<input id="in_w" placeholder="عرض داخلي">
<input id="in_h" placeholder="ارتفاع داخلي">

<input id="out_w" placeholder="عرض خارجي">
<input id="out_h" placeholder="ارتفاع خارجي">

<select id="lock" onchange="drawDoor()">
<option value="يمين">يمين</option>
<option value="يسار">يسار</option>
</select>

<textarea id="details" placeholder="تفاصيل"></textarea>

<input type="file" onchange="previewImage(event)">
<img id="preview" class="preview"/>

</div>

<div class="card canvas-box">
<canvas id="canvas" width="320" height="200"></canvas>
</div>

<button class="btn" onclick="generatePDF()">📄 إنشاء PDF</button>

</div>

<!-- PDF -->
<div id="pdfContent" style="display:none; background:#fff; color:#000; padding:20px;">

<h2 style="text-align:center;">Pro Design CNC</h2>
<hr>

<p>رقم الطلب: <span id="pdf_id"></span></p>
<p>نوع الباب: <span id="pdf_type"></span></p>
<p>الداخل: <span id="pdf_in"></span></p>
<p>الخارج: <span id="pdf_out"></span></p>
<p>القفل: <span id="pdf_lock"></span></p>

<canvas id="pdfCanvas" width="320" height="200"></canvas>

<p id="pdf_details"></p>

<img id="pdf_img" style="width:100%; margin-top:10px;">

</div>

<script>

function previewImage(e){
  let reader=new FileReader();
  reader.onload=function(){
    preview.src=reader.result;
  }
  reader.readAsDataURL(e.target.files[0]);
}

function drawDoor(){

  let type=doorType.value;
  let lock=lockSelect.value;

  let c=document.getElementById("canvas");
  let ctx=c.getContext("2d");

  ctx.clearRect(0,0,320,200);
  ctx.lineWidth=2;

  if(type==="single"){
    ctx.strokeRect(110,20,100,160);

    ctx.beginPath();

    if(lock==="يمين"){
      ctx.moveTo(110,100);
      ctx.lineTo(210,20);
      ctx.moveTo(110,100);
      ctx.lineTo(210,180);
    }else{
      ctx.moveTo(210,100);
      ctx.lineTo(110,20);
      ctx.moveTo(210,100);
      ctx.lineTo(110,180);
    }

    ctx.stroke();
  }

  if(type==="double"){
    ctx.strokeRect(30,20,100,160);
    ctx.strokeRect(190,20,100,160);

    ctx.beginPath();

    ctx.moveTo(130,100);
    ctx.lineTo(30,20);
    ctx.moveTo(130,100);
    ctx.lineTo(30,180);

    ctx.moveTo(190,100);
    ctx.lineTo(290,20);
    ctx.moveTo(190,100);
    ctx.lineTo(290,180);

    ctx.stroke();
  }

  if(type==="onehalf"){
    ctx.strokeRect(30,20,80,160);
    ctx.strokeRect(120,20,170,160);

    ctx.beginPath();
    ctx.moveTo(120,100);
    ctx.lineTo(290,20);
    ctx.moveTo(120,100);
    ctx.lineTo(290,180);

    ctx.stroke();
  }
}

drawDoor();

function generatePDF(){

  pdf_id.innerText="PD-"+Date.now();
  pdf_type.innerText=doorType.value;
  pdf_in.innerText=in_w.value+"×"+in_h.value;
  pdf_out.innerText=out_w.value+"×"+out_h.value;
  pdf_lock.innerText=lock.value;
  pdf_details.innerText=details.value;

  if(preview.src) pdf_img.src=preview.src;

  let c=document.getElementById("pdfCanvas");
  let ctx=c.getContext("2d");

  let main=document.getElementById("canvas");
  ctx.drawImage(main,0,0);

  let el=document.getElementById("pdfContent");
  el.style.display="block";

  html2canvas(el).then(canvas=>{
    const { jsPDF } = window.jspdf;
    let pdf=new jsPDF();
    pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,210,297);
    pdf.save("order.pdf");
    el.style.display="none";
  });
}

</script>

</body>
</html>

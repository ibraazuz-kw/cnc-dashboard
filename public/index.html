<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طلب CNC</title>

<style>
body{
  background:#0b0f14;
  color:#fff;
  font-family:Arial;
  padding:20px;
}
.card{
  background:#111b27;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
}
button{
  background:#2f7bff;
  color:#fff;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🚀 طلب CNC</h2>

<div class="card">
  <label>نوع المادة</label>
  <select id="material">
    <option>ألمنيوم</option>
    <option>ألكبوند</option>
  </select>

  <label>نوع العملية</label>
  <select id="type">
    <option>قص</option>
    <option>حفر</option>
    <option>قص + حفر</option>
  </select>
</div>

<button onclick="send()">جرب البيانات</button>

<script>
function send(){
  alert(
    "المادة: " + material.value +
    "\nالعملية: " + type.value
  );
}
</script>

</body>
</html>

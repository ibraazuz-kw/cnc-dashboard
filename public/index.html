<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Design ERP</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="topbar">

<h1>🚀 Pro Design ERP</h1>

<button onclick="openModal()" class="main-btn">
➕ إضافة طلب
</button>

</div>

<div id="orders" class="orders"></div>

</div>

<!-- Modal -->

<div class="modal" id="modal">

<div class="modal-box">

<h2>إضافة طلب جديد</h2>

<input id="clientName" placeholder="اسم العميل">

<input id="projectName" placeholder="اسم المشروع">

<textarea id="projectDetails" placeholder="تفاصيل المشروع"></textarea>

<select id="projectStatus">
<option value="جديد">جديد</option>
<option value="تحت التصميم">تحت التصميم</option>
<option value="بانتظار الاعتماد">بانتظار الاعتماد</option>
<option value="جاهز للتصنيع">جاهز للتصنيع</option>
</select>

<label class="upload-box">

رفع التصميم / PDF

<input type="file" id="projectFile" hidden>

</label>

<img id="preview" class="preview">

<button onclick="saveOrder()" class="save-btn">
💾 حفظ الطلب
</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رفع فيديو</title>

<style>

body{
margin:0;
font-family:Cairo,sans-serif;
background:#F5E6C8;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

h1{
text-align:center;
color:#3d2b1f;
margin-bottom:30px;
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:12px;
}

button{
width:100%;
padding:18px;
border:none;
background:#C89B3C;
color:white;
font-size:18px;
font-weight:bold;
border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>رفع فيديو جديد</h1>

<input type="file">

<input type="text" placeholder="عنوان الفيديو">

<textarea rows="5" placeholder="وصف الفيديو"></textarea>

<button>
نشر الفيديو
</button>

</div>

</body>
</html>

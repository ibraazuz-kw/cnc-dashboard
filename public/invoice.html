<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة Pro Design</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
overflow:auto;
display:block;
padding:30px;
}

.invoice-page{
max-width:1100px;
margin:auto;
}

.invoice-box{
background:white;
color:black;
border-radius:30px;
padding:40px;
}

.invoice-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.logo{
font-size:38px;
font-weight:800;
color:#2563eb;
}

.invoice-title{
font-size:36px;
font-weight:800;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:35px;
}

.info-card{
background:#f3f6fb;
padding:22px;
border-radius:20px;
}

.info-card h3{
margin-bottom:14px;
font-size:20px;
}

.info-card p{
line-height:2;
color:#444;
}

.design-box{
margin-bottom:35px;
}

.design-box img{
width:100%;
max-height:450px;
object-fit:contain;
border-radius:22px;
border:1px solid #ddd;
background:#f8fafc;
}

.invoice-table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.invoice-table th{
background:#2563eb;
color:white;
padding:16px;
font-size:15px;
}

.invoice-table td{
padding:16px;
text-align:center;
border-bottom:1px solid #ddd;
font-size:15px;
}

.summary-box{
margin-top:40px;
width:360px;
margin-right:auto;
}

.summary-line{
display:flex;
justify-content:space-between;
padding:16px 0;
border-bottom:1px solid #ddd;
font-size:17px;
}

.final-total{
font-size:32px;
font-weight:800;
color:#10b981;
}

.invoice-actions{
display:flex;
gap:15px;
margin-top:35px;
}

.invoice-actions button{
flex:1;
padding:18px;
border:none;
border-radius:18px;
font-size:17px;
font-weight:800;
cursor:pointer;
color:white;
}

.pdf-btn{
background:#2563eb;
}

.print-btn{
background:#10b981;
}

@media(max-width:900px){

.info-grid{
grid-template-columns:1fr;
}

.invoice-top{
flex-direction:column;
align-items:flex-start;
gap:20px;
}

.summary-box{
width:100%;
}

}

</style>

</head>

<body>

<div class="invoice-page">

<div class="invoice-box" id="invoiceContent">

<!-- Top -->

<div class="invoice-top">

<div class="logo">
🚀 PRO DESIGN
</div>

<div class="invoice-title">
فاتورة رسمية
</div>

</div>

<!-- Info -->

<div class="info-grid">

<div class="info-card">

<h3>
👤 بيانات العميل
</h3>

<p id="clientName"></p>

<p id="projectName"></p>

<p id="clientPhone"></p>

</div>

<div class="info-card">

<h3>
📋 بيانات الطلب
</h3>

<p id="invoiceNumber"></p>

<p id="invoiceDate"></p>

<p id="invoiceStatus"></p>

</div>

</div>

<!-- Design -->

<div class="design-box">

<img id="projectImage">

</div>

<!-- Table -->

<table class="invoice-table">

<thead>

<tr>

<th>الوصف</th>
<th>الكمية</th>
<th>سعر الوحدة</th>
<th>الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceTable"></tbody>

</table>

<!-- Summary -->

<div class="summary-box">

<div class="summary-line">
<span>سعر الوحدات</span>
<span id="itemsTotal"></span>
</div>

<div class="summary-line">
<span>الإضافات</span>
<span id="extraTotal"></span>
</div>

<div class="summary-line">
<span>الخصم</span>
<span id="discountTotal"></span>
</div>

<div class="summary-line">
<span class="final-total">
الإجمالي
</span>

<span
class="final-total"
id="finalTotal"
>

0 KD

</span>

</div>

</div>

</div>

<!-- Actions -->

<div class="invoice-actions">

<button
class="pdf-btn"
onclick="downloadPDF()"
>

📄 تحميل PDF

</button>

<button
class="print-btn"
onclick="window.print()"
>

🖨 طباعة

</button>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const id =
Number(params.get("id"));

const orders =
JSON.parse(localStorage.getItem("orders")) || [];

const order =
orders.find(o => o.id === id);

/* =========================
   Load Invoice
========================= */

if(order){

clientName.innerText =
"العميل: " + order.clientName;

projectName.innerText =
"المشروع: " + order.projectName;

clientPhone.innerText =
"واتساب: " + order.clientPhone;

invoiceNumber.innerText =
"رقم الفاتورة: INV-" + order.id;

invoiceDate.innerText =
"التاريخ: " + order.createdAt;

invoiceStatus.innerText =
"الحالة: " + order.projectStatus;

projectImage.src =
order.image;

if(order.pricing){

const pricing =
order.pricing;

invoiceTable.innerHTML += `

<tr>

<td>
${order.projectName}
</td>

<td>
${pricing.quantity}
</td>

<td>
${pricing.unitPrice} KD
</td>

<td>
${pricing.total} KD
</td>

</tr>

`;

itemsTotal.innerText =
(
pricing.unitPrice *
pricing.quantity
) + " KD";

extraTotal.innerText =
pricing.extraCost + " KD";

discountTotal.innerText =
pricing.discount + " KD";

finalTotal.innerText =
pricing.total + " KD";

}

}

/* =========================
   PDF
========================= */

async function downloadPDF(){

const element =
document.getElementById("invoiceContent");

const canvas =
await html2canvas(element,{
scale:2
});

const imgData =
canvas.toDataURL("image/png");

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF("p","mm","a4");

const width = 210;

const height =
(canvas.height * width)
/
canvas.width;

pdf.addImage(
imgData,
"PNG",
0,
0,
width,
height
);

pdf.save(
"ProDesignInvoice.pdf"
);

}

</script>

</body>
</html>

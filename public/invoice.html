<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Design Invoice</title>

<link rel="stylesheet" href="invoice.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="invoice-wrapper">

<div class="header">

<div class="company">

<h1>PRO DESIGN</h1>

<p>Aluminum & CNC</p>

</div>

<div class="invoice-title">

<h2>فاتورة</h2>

<span>INVOICE</span>

</div>

</div>

<div class="top-info">

<div class="card">

<h3>بيانات العميل</h3>

<input id="customerName" placeholder="اسم العميل">

<input id="customerPhone" placeholder="رقم الهاتف">

<input id="orderNumber" placeholder="رقم الطلب">

</div>

<div class="card">

<h3>بيانات الفاتورة</h3>

<div class="info-line">

<span>رقم الفاتورة</span>

<b id="invoiceNo"></b>

</div>

<div class="info-line">

<span>التاريخ</span>

<b id="todayDate"></b>

</div>

</div>

</div>

<div class="service-box">

<h3>إضافة خدمة</h3>

<div class="service-grid">

<input id="service" placeholder="تفاصيل العمل">

<input id="thickness" placeholder="السماكة">

<input id="qty" type="number" placeholder="الكمية">

<input id="price" type="number" placeholder="سعر الوحدة">

</div>

<button class="add-btn" onclick="addItem()">

إضافة خدمة

</button>

</div>

<table>

<thead>

<tr>

<th>م</th>

<th>تفاصيل العمل</th>

<th>السماكة</th>

<th>الكمية</th>

<th>سعر الوحدة</th>

<th>الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceRows">

</tbody>

</table>

<div class="total-box">

الإجمالي النهائي

<span id="grandTotal">

0.000

</span>

د.ك

</div>

<div class="actions no-print">

<button onclick="window.print()" class="print-btn">

طباعة / PDF

</button>

</div>

<div class="footer">

📍 الكويت - الري - مقابل سوبر ستيل

<br>

📞 96765547

<br>

📧 pro.design.q8@gmail.com

</div>

</div>

<script src="invoice.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة PRO DESIGN</title>

<link rel="stylesheet" href="invoice.css">

</head>

<body>

<div class="container">

<h1>PRO DESIGN</h1>

<div class="box">

<h2>بيانات العميل</h2>

<input id="customerName" placeholder="اسم العميل">

<input id="customerPhone" placeholder="رقم الهاتف">

<input id="orderNumber" placeholder="رقم الطلب">

</div>

<div class="box">

<h2>إضافة خدمة</h2>

<input id="service" placeholder="تفاصيل العمل">

<input id="thickness" placeholder="السماكة">

<input id="qty" type="number" placeholder="الكمية">

<input id="price" type="number" placeholder="سعر الوحدة">

<button onclick="addItem()">
إضافة خدمة
</button>

</div>

<table>

<thead>

<tr>

<th>م</th>
<th>تفاصيل العمل</th>
<th>السماكة</th>
<th>الكمية</th>
<th>سعر الوحدة</th>
<th>الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceRows">

</tbody>

</table>

<div class="total">

الإجمالي النهائي:

<span id="grandTotal">
0.000
</span>

د.ك

</div>

<div class="buttons">

<button onclick="window.print()">
طباعة
</button>

</div>

</div>

<script src="invoice.js"></script>

</body>
</html>

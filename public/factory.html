<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المصنع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#efefef;
padding:20px;
}

.header{
background:#001446;
color:#fff;
padding:35px;
border-radius:30px;
text-align:center;
font-size:45px;
font-weight:900;
margin-bottom:30px;
}

.card{
background:#fff;
padding:40px;
border-radius:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:45px;
font-weight:900;
color:#001446;
margin-bottom:30px;
}

.text{
font-size:30px;
line-height:2.2;
}

.status{
display:inline-block;
background:#001446;
color:#fff;
padding:15px 35px;
border-radius:15px;
font-size:24px;
margin-top:20px;
}

.progress{
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:35px 0;
}

.progress span{
display:block;
height:100%;
width:70%;
background:#ff6600;
}

.step{
background:#f7f7f7;
padding:25px;
border-radius:20px;
margin-bottom:20px;
font-size:26px;
}

</style>
</head>

<body>

<div class="header">
قسم المصنع
</div>

<div class="card">

<div class="title">
طلب CNC
</div>

<div class="text">
العميل : شركة باب السيف
</div>

<div class="text">
المادة : ألمنيوم
</div>

<div class="status">
قيد التصنيع
</div>

<div class="progress">
<span></span>
</div>

<div class="step">✅ تم استلام الطلب</div>

<div class="step">✅ بدأ القص</div>

<div class="step">✅ بدأ الحفر</div>

<div class="step">⏳ جاري التجهيز</div>

<div class="step">⌛ بانتظار التسليم</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم المصنع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

body{
background:#f3f3f3;
padding:20px;
font-family:'Cairo',sans-serif;
}

.header{
background:#00133d;
color:#fff;
padding:30px;
border-radius:30px;
text-align:center;
font-size:40px;
font-weight:900;
margin-bottom:25px;
}

.order{
background:#fff;
padding:30px;
border-radius:30px;
margin-bottom:20px;
}

h2{
font-size:35px;
margin-bottom:20px;
color:#00133d;
}

p{
font-size:24px;
margin-bottom:15px;
}

.progress{
height:18px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:20px 0;
}

.progress span{
display:block;
height:100%;
width:70%;
background:#ff6200;
}

.status{
display:inline-block;
padding:10px 18px;
background:#00133d;
color:#fff;
border-radius:15px;
font-size:20px;
}

.btn{
display:inline-block;
background:#ff6200;
color:#fff;
padding:15px 30px;
border-radius:15px;
text-decoration:none;
font-size:22px;
margin-top:20px;
}

.steps{
margin-top:20px;
}

.step{
background:#fafafa;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="header">
قسم المصنع
</div>

<div class="order">

<h2>طلب CNC</h2>

<p>العميل : شركة باب السيف</p>

<p>المادة : ألمنيوم</p>

<div class="status">
قيد التصنيع
</div>

<div class="progress">
<span></span>
</div>

<div class="steps">

<div class="step">✅ تم استلام الطلب</div>

<div class="step">✅ بدء القص</div>

<div class="step">✅ بدء الحفر</div>

<div class="step">⏳ جاري التجهيز</div>

<div class="step">⌛ بانتظار التسليم</div>

</div>

<a href="invoice.html" class="btn">
فتح الفاتورة
</a>

</div>

</body>
</html>

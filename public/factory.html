<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لوحة المصنع</title>

<style>

body{
margin:0;
padding:20px;
background:#020826;
font-family:sans-serif;
color:white;
direction:rtl;
}

.title{
font-size:50px;
font-weight:bold;
text-align:center;
margin-bottom:40px;
}

.orders{
display:flex;
flex-direction:column;
gap:25px;
}

.card{
background:#07153d;
padding:30px;
border-radius:30px;
}

.status{
display:inline-block;
padding:15px 25px;
background:#d97706;
border-radius:18px;
font-size:22px;
margin-bottom:25px;
}

.company{
font-size:45px;
font-weight:bold;
margin-bottom:25px;
}

.info{
font-size:28px;
line-height:2;
color:#ddd;
}

.preview{
margin-top:20px;
background:#0d1d4f;
padding:15px;
border-radius:15px;
font-size:20px;
color:#8de1ff;
}

.buttons{
display:flex;
gap:15px;
margin-top:30px;
}

.btn{
flex:1;
padding:22px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
}

.download{
background:#2563eb;
}

.done{
background:#16a34a;
}

</style>
</head>

<body>

<h1 class="title">
🏭 لوحة المصنع
</h1>

<div class="orders" id="orders"></div>

<script>

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

const ordersContainer =
document.getElementById("orders");

function renderOrders(){

ordersContainer.innerHTML = "";

const factoryOrders =
orders.filter(order =>

order.status === "قيد التصنيع"

);

if(factoryOrders.length === 0){

ordersContainer.innerHTML = `

<div class="card">

<div class="company">
لا توجد طلبات حالياً
</div>

</div>

`;

return;

}

factoryOrders.forEach((order,index)=>{

ordersContainer.innerHTML += `

<div class="card">

<div class="status">
${order.status}
</div>

<div class="company">
${order.company}
</div>

<div class="info">
📐 التصميم:
${order.design}
</div>

<div class="info">
📦 الشيتات:
${order.sheets}
</div>

<div class="info">
📏 المقاس:
${order.size}
</div>

${order.fileName ? `

<div class="preview">

📎 الملف المرفوع:
${order.fileName}

</div>

` : ""}

<div class="buttons">

<button
class="btn download"
onclick="downloadFile(${index})">

📥 تحميل الملف

</button>

<button
class="btn done"
onclick="finishOrder(${index})">

✅ تم التسليم

</button>

</div>

</div>

`;

});

}

function downloadFile(index){

alert(
"📥 سيتم تحميل الملف قريباً"
);

}

function finishOrder(index){

const factoryOrders =
orders.filter(order =>

order.status === "قيد التصنيع"

);

const targetOrder =
factoryOrders[index];

const realIndex =
orders.findIndex(o =>

o.company === targetOrder.company

);

orders[realIndex].status =
"تم التسليم";

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

renderOrders();

alert(
"✅ تم تسليم الطلب"
);

}

renderOrders();

</script>

</body>
</html>

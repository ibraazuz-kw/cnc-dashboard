<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المصمم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
background:#fff;
padding:20px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.header img{
max-width:220px;
}

.header h1{
margin-top:15px;
color:#6f42c1;
}

.card{
background:#fff;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:15px;
}

input,
textarea{
width:100%;
padding:14px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:12px;
}

textarea{
height:120px;
}

button{
width:100%;
padding:15px;
border:none;
background:#6f42c1;
color:white;
font-size:18px;
font-weight:bold;
border-radius:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="file_00000000fd40720abbbe4a62d7158405.jpg">

<h1>لوحة المصمم</h1>

</div>

<div class="card">

<h3>بيانات الطلب</h3>

<input placeholder="رقم الطلب">

<input placeholder="اسم العميل">

<textarea placeholder="ملاحظات التصميم"></textarea>

<input type="file">

<button>
رفع التصميم النهائي
</button>

</div>

<div class="card">

<h3>حالة التصميم</h3>

<p>جاهز للإرسال للإدارة</p>

</div>

</div>

</body>

</html>

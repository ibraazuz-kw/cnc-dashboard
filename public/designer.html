<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المصمم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#efefef;
padding:20px;
}

.header{
background:#001446;
color:#fff;
padding:35px;
border-radius:30px;
text-align:center;
font-size:45px;
font-weight:900;
margin-bottom:30px;
}

.card{
background:#fff;
padding:40px;
border-radius:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:45px;
font-weight:900;
color:#001446;
margin-bottom:30px;
}

.text{
font-size:30px;
line-height:2.2;
}

.status{
display:inline-block;
background:#ff6600;
color:#fff;
padding:15px 35px;
border-radius:15px;
font-size:24px;
margin-top:20px;
}

.upload{
margin-top:30px;
padding:35px;
border:2px dashed #bbb;
border-radius:20px;
text-align:center;
font-size:24px;
}

.buttons{
display:flex;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.btn{
flex:1;
padding:20px;
text-align:center;
border-radius:20px;
font-size:30px;
font-weight:700;
color:#fff;
text-decoration:none;
}

.green{
background:#1faa45;
}

.red{
background:#df1f2d;
}

</style>
</head>

<body>

<div class="header">
قسم المصمم
</div>

<div class="card">

<div class="title">
تصميم واجهة CNC
</div>

<div class="text">
العميل : شركة باب السيف
</div>

<div class="text">
نوع العمل : قص وحفر ألمنيوم
</div>

<div class="status">
بانتظار الاعتماد
</div>

<div class="upload">

رفع التصميم

<br><br>

<input type="file">

</div>

<div class="buttons">

<a href="#" class="btn green">
اعتماد
</a>

<a href="#" class="btn red">
رفض
</a>

</div>

</div>

</body>
</html>

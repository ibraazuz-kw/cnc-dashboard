<script>

/* =========================
   رفع الملفات
========================= */

const uploadInput = document.querySelector('input[type="file"]');

uploadInput.addEventListener("change", function(){

const file = this.files[0];

if(!file) return;

const fileURL = URL.createObjectURL(file);

localStorage.setItem("designFile", fileURL);

localStorage.setItem("designFileName", file.name);

alert("✅ تم رفع التصميم بنجاح");

});


/* =========================
   عرض التصميم
========================= */

const previewBox = document.querySelector(".preview");

const savedFile = localStorage.getItem("designFile");

const savedName = localStorage.getItem("designFileName");

if(savedFile){

if(savedName.endsWith(".png") ||
   savedName.endsWith(".jpg") ||
   savedName.endsWith(".jpeg")){

previewBox.innerHTML = `
<img src="${savedFile}"
style="
width:100%;
height:100%;
object-fit:contain;
border-radius:20px;
">
`;

}

else{

previewBox.innerHTML = `
<div style="text-align:center">

<h2 style="font-size:30px">
📄 ${savedName}
</h2>

</div>
`;

}

}


/* =========================
   اعتماد التصميم
========================= */

const approveBtn =
document.querySelector(".green");

approveBtn.addEventListener("click", function(){

localStorage.setItem(
"orderStatus",
"في التصنيع"
);

alert("✅ تم اعتماد التصميم وتحويله للتصنيع");

});


/* =========================
   طلب تعديل
========================= */

const editBtn =
document.querySelector(".gold");

editBtn.addEventListener("click", function(){

localStorage.setItem(
"orderStatus",
"يوجد تعديل"
);

alert("🔄 تم إرسال طلب تعديل");

});


/* =========================
   فتح PDF
========================= */

const pdfBtn =
document.querySelector(".red");

pdfBtn.addEventListener("click", function(){

if(savedFile){

window.open(savedFile);

}else{

alert("لا يوجد ملف PDF");

}

});


/* =========================
   فتح DXF
========================= */

const dxfBtn =
document.querySelector(".blue");

dxfBtn.addEventListener("click", function(){

if(savedFile){

window.open(savedFile);

}else{

alert("لا يوجد ملف DXF");

}

});


/* =========================
   فتح الصورة
========================= */

const imageBtn =
document.querySelector(".gold");

imageBtn.addEventListener("click", function(){

if(savedFile){

window.open(savedFile);

}else{

alert("لا توجد صورة");

}

});


/* =========================
   تسجيل الخروج
========================= */

const logoutBtn =
document.querySelector(".logout");

logoutBtn.addEventListener("click", function(){

window.location.href =
"login.html";

});

</script>

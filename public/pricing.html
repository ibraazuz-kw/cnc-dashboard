<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسعير المشروع</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
overflow:auto;
display:block;
padding:30px;
}

.pricing-page{
max-width:1100px;
margin:auto;
}

.pricing-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.pricing-header h1{
font-size:34px;
font-weight:800;
}

.project-card{
background:#0d1724;
border-radius:24px;
padding:25px;
margin-bottom:25px;
border:1px solid rgba(255,255,255,.05);
}

.project-top{
display:flex;
gap:25px;
align-items:center;
}

.project-image{
width:260px;
height:220px;
border-radius:20px;
object-fit:cover;
background:#08111c;
}

.project-info h2{
font-size:30px;
margin-bottom:10px;
}

.project-info p{
color:#94a3b8;
line-height:2;
}

.pricing-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

.input-box{
background:#08111c;
padding:18px;
border-radius:18px;
}

.input-box label{
display:block;
margin-bottom:12px;
font-size:15px;
color:#94a3b8;
}

.input-box input{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#0d1724;
color:white;
font-size:16px;
outline:none;
}

.sheet-section{
margin-top:30px;
}

.sheet-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.add-sheet-btn{
padding:12px 18px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
}

.sheet-item{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
gap:15px;
background:#08111c;
padding:15px;
border-radius:18px;
margin-bottom:15px;
}

.sheet-item input{
padding:14px;
border:none;
border-radius:12px;
background:#0d1724;
color:white;
}

.summary-card{
background:#0d1724;
padding:25px;
border-radius:24px;
margin-top:30px;
border:1px solid rgba(255,255,255,.05);
}

.summary-card h2{
margin-bottom:20px;
font-size:28px;
}

.summary-line{
display:flex;
justify-content:space-between;
padding:18px 0;
border-bottom:1px solid rgba(255,255,255,.06);
font-size:17px;
}

.summary-total{
font-size:30px;
font-weight:800;
color:#10b981;
}

.save-pricing-btn{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#10b981;
color:white;
font-size:18px;
font-weight:800;
cursor:pointer;
margin-top:30px;
}

@media(max-width:900px){

.project-top{
flex-direction:column;
}

.pricing-grid{
grid-template-columns:1fr;
}

.sheet-item{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="pricing-page">

<div class="pricing-header">

<h1>
💰 تسعير المشروع
</h1>

</div>

<div class="project-card">

<div class="project-top">

<img
id="projectImage"
class="project-image"
>

<div class="project-info">

<h2 id="projectName"></h2>

<p id="projectDetails"></p>

</div>

</div>

<!-- Inputs -->

<div class="pricing-grid">

<div class="input-box">

<label>
سعر الوحدة
</label>

<input
type="number"
id="unitPrice"
placeholder="0"
>

</div>

<div class="input-box">

<label>
الكمية
</label>

<input
type="number"
id="quantity"
placeholder="0"
>

</div>

<div class="input-box">

<label>
تكلفة إضافية
</label>

<input
type="number"
id="extraCost"
placeholder="0"
>

</div>

<div class="input-box">

<label>
الخصم
</label>

<input
type="number"
id="discount"
placeholder="0"
>

</div>

</div>

<!-- Sheets -->

<div class="sheet-section">

<div class="sheet-header">

<h2>
📦 الشيتات المطلوبة
</h2>

<button
class="add-sheet-btn"
onclick="addSheet()"
>

➕ إضافة شيت

</button>

</div>

<div id="sheetContainer"></div>

</div>

</div>

<!-- Summary -->

<div class="summary-card">

<h2>
🧾 ملخص الفاتورة
</h2>

<div class="summary-line">
<span>سعر الوحدات</span>
<span id="itemsTotal">0 KD</span>
</div>

<div class="summary-line">
<span>الإضافات</span>
<span id="extraTotal">0 KD</span>
</div>

<div class="summary-line">
<span>الخصم</span>
<span id="discountTotal">0 KD</span>
</div>

<div class="summary-line">
<span class="summary-total">
الإجمالي
</span>

<span
class="summary-total"
id="finalTotal"
>

0 KD

</span>

</div>

<button
class="save-pricing-btn"
onclick="savePricing()"
>

💾 حفظ التسعير

</button>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const id =
Number(params.get("id"));

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

let order =
orders.find(o => o.id === id);

/* =========================
   Load Data
========================= */

if(order){

projectImage.src = order.image;

projectName.innerText = order.projectName;

projectDetails.innerText =
order.projectDetails;

if(order.pricing){

unitPrice.value =
order.pricing.unitPrice || 0;

quantity.value =
order.pricing.quantity || 0;

extraCost.value =
order.pricing.extraCost || 0;

discount.value =
order.pricing.discount || 0;

calculate();

}

}

/* =========================
   Add Sheet
========================= */

function addSheet(){

sheetContainer.innerHTML += `

<div class="sheet-item">

<input placeholder="نوع الشيت">

<input placeholder="السماكة">

<input placeholder="الكمية">

<input placeholder="التكلفة">

</div>

`;

}

/* =========================
   Calculate
========================= */

document
.querySelectorAll("input")
.forEach(input => {

input.addEventListener("input", calculate);

});

function calculate(){

const unit =
Number(unitPrice.value) || 0;

const qty =
Number(quantity.value) || 0;

const extra =
Number(extraCost.value) || 0;

const dis =
Number(discount.value) || 0;

const items =
unit * qty;

const total =
items + extra - dis;

itemsTotal.innerText =
items + " KD";

extraTotal.innerText =
extra + " KD";

discountTotal.innerText =
dis + " KD";

finalTotal.innerText =
total + " KD";

}

/* =========================
   Save Pricing
========================= */

function savePricing(){

const total =
(
(Number(unitPrice.value) *
Number(quantity.value))
+
Number(extraCost.value)
-
Number(discount.value)
);

order.price = total;

order.pricing = {

unitPrice:
Number(unitPrice.value),

quantity:
Number(quantity.value),

extraCost:
Number(extraCost.value),

discount:
Number(discount.value),

total

};

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

alert("✅ تم حفظ التسعير");

window.location.href =
"index.html";

}

calculate();

</script>

</body>
</html>

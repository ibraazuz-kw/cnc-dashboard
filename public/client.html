<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>العميل</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#efefef;
padding:20px;
}

.header{
background:#001446;
color:#fff;
padding:35px;
border-radius:30px;
text-align:center;
font-size:45px;
font-weight:900;
margin-bottom:30px;
}

.card{
background:#fff;
padding:40px;
border-radius:30px;
margin-bottom:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:45px;
font-weight:900;
color:#001446;
margin-bottom:30px;
}

.text{
font-size:30px;
line-height:2.2;
}

.status{
display:inline-block;
background:#1faa45;
color:#fff;
padding:15px 35px;
border-radius:15px;
font-size:24px;
margin-top:25px;
}

.btn{
display:block;
background:#ff6600;
color:#fff;
padding:20px;
border-radius:20px;
font-size:30px;
font-weight:700;
text-align:center;
margin-top:20px;
text-decoration:none;
}

.btn-blue{
background:#001446;
}

textarea{
width:100%;
height:180px;
padding:20px;
font-size:22px;
border-radius:20px;
border:1px solid #ccc;
margin-top:20px;
}

.upload{
margin-top:25px;
padding:30px;
border:2px dashed #bbb;
border-radius:20px;
text-align:center;
font-size:24px;
}

input{
margin-top:20px;
font-size:20px;
}

</style>
</head>

<body>

<div class="header">
بوابة العميل
</div>

<div class="card">

<div class="title">
بيانات العميل
</div>

<div class="text">
اسم العميل : شركة باب السيف
</div>

<div class="text">
رقم الهاتف : 96765547
</div>

<div class="text">
المشروع : CNC ألمنيوم
</div>

<div class="status">
جاري التنفيذ
</div>

<a href="invoice.html" class="btn">
عرض الفاتورة
</a>

<a href="designer.html" class="btn btn-blue">
عرض التصميم
</a>

</div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اعتماد التصميم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.client-page{
max-width:900px;
margin:auto;
padding:20px;
}

.client-card{
background:#102235;
border-radius:20px;
overflow:hidden;
margin-top:20px;
border:1px solid rgba(255,255,255,.05);
}

.client-card img{
width:100%;
max-height:600px;
object-fit:contain;
background:#081420;
}

.client-content{
padding:25px;
}

.client-title{
font-size:30px;
font-weight:700;
margin-bottom:10px;
}

.client-project{
font-size:20px;
color:#9ec5ff;
margin-bottom:20px;
}

.client-details{
line-height:2;
color:#d4dce5;
margin-bottom:20px;
}

.client-status{
display:inline-block;
padding:10px 18px;
border-radius:12px;
background:#9333ea;
margin-bottom:20px;
font-weight:700;
}

.action-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:25px;
}

.approve-btn{
background:#10b981;
}

.edit-btn{
background:#f59e0b;
}

.action-buttons button{
padding:15px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:700;
color:white;
cursor:pointer;
}

.edit-box{
margin-top:25px;
display:none;
}

.edit-box textarea{
width:100%;
height:140px;
background:#081420;
border:none;
border-radius:14px;
padding:15px;
color:white;
margin-bottom:15px;
resize:none;
}

.edit-box input{
width:100%;
padding:14px;
background:#081420;
border:none;
border-radius:14px;
color:white;
}

.preview-edit{
width:100%;
border-radius:14px;
margin-top:15px;
display:none;
}

.send-edit{
margin-top:15px;
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.invoice-box{
margin-top:25px;
padding:20px;
background:#081420;
border-radius:16px;
display:none;
}

.invoice-box h2{
margin-bottom:15px;
}

.invoice-line{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.download-btn{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

</style>

</head>

<body>

<div class="client-page">

<div class="client-card">

<img id="projectImage">

<div class="client-content">

<div class="client-title" id="clientName"></div>

<div class="client-project" id="projectName"></div>

<div class="client-details" id="projectDetails"></div>

<div class="client-status" id="projectStatus"></div>

<div class="action-buttons">

<button class="approve-btn" onclick="approveDesign()">
✅ اعتماد التصميم
</button>

<button class="edit-btn" onclick="showEditBox()">
✏️ يوجد تعديل
</button>

</div>

<!-- التعديلات -->

<div class="edit-box" id="editBox">

<textarea id="editNotes" placeholder="اكتب التعديلات المطلوبة"></textarea>

<input type="file" id="editImage">

<img id="editPreview" class="preview-edit">

<button class="send-edit" onclick="sendEdit()">
📩 إرسال التعديل
</button>

</div>

<!-- الفاتورة -->

<div class="invoice-box" id="invoiceBox">

<h2>🧾 الفاتورة</h2>

<div class="invoice-line">
<span>سعر الوحدة</span>
<span id="unitPrice"></span>
</div>

<div class="invoice-line">
<span>الكمية</span>
<span id="quantity"></span>
</div>

<div class="invoice-line">
<span>الإجمالي</span>
<span id="totalPrice"></span>
</div>

<button class="download-btn">
📄 تحميل الفاتورة PDF
</button>

</div>

</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const id = Number(params.get("id"));

const orders = JSON.parse(localStorage.getItem("orders")) || [];

const order = orders.find(o => o.id === id);

if(order){

document.getElementById("projectImage").src = order.file;

document.getElementById("clientName").innerText = order.clientName;

document.getElementById("projectName").innerText = order.projectName;

document.getElementById("projectDetails").innerText = order.projectDetails;

document.getElementById("projectStatus").innerText = order.projectStatus;

// الفاتورة إذا موجودة

if(order.pricing){

document.getElementById("invoiceBox").style.display = "block";

document.getElementById("unitPrice").innerText =
order.pricing.unitPrice + " KD";

document.getElementById("quantity").innerText =
order.pricing.quantity;

document.getElementById("totalPrice").innerText =
order.pricing.total + " KD";

}

}

// اعتماد التصميم

function approveDesign(){

alert("✅ تم اعتماد التصميم");

}

// اظهار التعديل

function showEditBox(){

document.getElementById("editBox").style.display = "block";

}

// رفع صورة تعديل

document.getElementById("editImage").addEventListener("change", function(e){

const file = e.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(){

editPreview.src = reader.result;

editPreview.style.display = "block";

}

reader.readAsDataURL(file);

}

});

// ارسال التعديل

function sendEdit(){

alert("📩 تم إرسال التعديل للإدارة");

}

</script>

</body>
</html>

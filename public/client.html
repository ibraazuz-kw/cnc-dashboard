<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب تشغيل جديد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
max-width:220px;
}

h1{
text-align:center;
color:#007bff;
margin-bottom:20px;
}

input,
select,
textarea{
width:100%;
padding:15px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#007bff;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<img src="file_00000000fd40720abbbe4a62d7158405.jpg">
</div>

<h1>طلب تشغيل جديد</h1>

<input id="company" placeholder="اسم الشركة">

<input id="person" placeholder="اسم المسؤول">

<input id="phone" placeholder="رقم الهاتف">

<select id="material">

<option>ألمنيوم</option>

<option>ستانلس</option>

<option>حديد</option>

<option>ألكوبوند</option>

<option>خشب</option>

</select>

<input id="thickness" placeholder="السماكة">

<input id="qty" placeholder="الكمية">

<input type="file">

<textarea id="notes" placeholder="ملاحظات الطلب"></textarea>

<button onclick="sendOrder()">

إرسال طلب التشغيل

</button>

</div>

<script>

function sendOrder(){

const company =
document.getElementById("company").value;

const person =
document.getElementById("person").value;

const phone =
document.getElementById("phone").value;

const material =
document.getElementById("material").value;

const thickness =
document.getElementById("thickness").value;

const qty =
document.getElementById("qty").value;

const notes =
document.getElementById("notes").value;

const msg =

`طلب تشغيل جديد

الشركة: ${company}

المسؤول: ${person}

الهاتف: ${phone}

المادة: ${material}

السماكة: ${thickness}

الكمية: ${qty}

الملاحظات:
${notes}`;

window.open(

`https://wa.me/96596765547?text=${encodeURIComponent(msg)}`,

"_blank"

);

}

</script>

</body>

</html>

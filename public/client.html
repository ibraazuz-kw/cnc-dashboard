<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لوحة العميل</title>

<style>

body{
margin:0;
padding:20px;
background:#020826;
font-family:Tahoma;
color:white;
}

.title{

font-size:55px;

font-weight:bold;

text-align:center;

margin-top:20px;

margin-bottom:50px;

}

.card{

background:#0b1736;

border-radius:30px;

padding:35px;

margin-bottom:35px;

border:1px solid #1b2b52;

}

.company{

font-size:45px;

font-weight:bold;

margin-bottom:35px;

}

.line{

font-size:34px;

margin-bottom:22px;

line-height:1.8;

word-break:break-word;

}

.price{

font-size:60px;

font-weight:bold;

color:#19e66e;

margin-top:40px;

margin-bottom:35px;

}

.status{

background:#9d650f;

padding:18px 28px;

border-radius:18px;

display:inline-block;

font-size:28px;

margin-bottom:40px;

}

.buttons{

display:flex;

gap:20px;

margin-top:30px;

}

.btn{

flex:1;

padding:24px;

border:none;

border-radius:20px;

font-size:30px;

font-weight:bold;

color:white;

cursor:pointer;

}

.green{
background:#16b34a;
}

.red{
background:#e12626;
}

.logout{

width:100%;

padding:25px;

background:#e12626;

border:none;

border-radius:22px;

font-size:34px;

color:white;

font-weight:bold;

margin-top:40px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="title">
👤 لوحة العميل
</div>

<div id="orders"></div>

<button class="logout"
onclick="logout()">

تسجيل خروج

</button>

<script src="data.js"></script>

<script>

const ordersContainer =
document.getElementById("orders");

function renderOrders(){

ordersContainer.innerHTML = "";

orders.forEach(order => {

ordersContainer.innerHTML += `

<div class="card">

<div class="status">
${order.status}
</div>

<div class="company">
${order.company}
</div>

<div class="line">
📐 التصميم:
${order.design}
</div>

<div class="line">
📦 الشيتات:
${order.sheets}
</div>

<div class="line">
📏 المقاس:
${order.size}
</div>

<div class="line">
💰 السعر:
KD ${order.price}
</div>

<div class="price">
KD ${order.price}
</div>

<div class="buttons">

<button class="btn green"
onclick="approveDesign(${order.id})">

اعتماد التصميم

</button>

<button class="btn red"
onclick="requestEdit(${order.id})">

طلب تعديل

</button>

</div>

</div>

`;

});

}

function approveDesign(id){

const order =
orders.find(o => o.id === id);

order.status =
"قيد التصميم";

saveOrders();

renderOrders();

alert("✅ تم اعتماد التصميم");

}

function requestEdit(id){

const order =
orders.find(o => o.id === id);

order.status =
"يوجد تعديل";

saveOrders();

renderOrders();

alert("✏️ تم إرسال طلب تعديل");

}

function logout(){

window.location.href =
"/login.html";

}

renderOrders();

</script>

</body>
</html>

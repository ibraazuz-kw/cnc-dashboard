<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
PRO DESIGN LOGIN
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#020617;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.login-box{

width:350px;
background:#0f172a;
padding:40px;
border-radius:20px;

}

h1{

color:white;
text-align:center;
margin-bottom:30px;

}

input{

width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:10px;
font-size:16px;

}

button{

width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.demo{

margin-top:20px;
color:#cbd5e1;
font-size:14px;
line-height:2;

}

</style>

</head>

<body>

<div class="login-box">

<h1>
🚀 PRO DESIGN
</h1>

<input
type="text"
id="username"
placeholder="اسم المستخدم"
>

<input
type="password"
id="password"
placeholder="كلمة المرور"
>

<button onclick="login()">
تسجيل الدخول
</button>

<div class="demo">

👑 admin / 1234

<br>

👨‍🏭 factory / 3333

<br>

👤 client1 / 1111

</div>

</div>

<script>

const users = [

{
username:"admin",
password:"1234",
role:"admin"
},

{
username:"factory",
password:"3333",
role:"factory"
},

{
username:"client1",
password:"1111",
role:"client"
}

];

function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const user = users.find(u =>

u.username === username
&&
u.password === password

);

if(!user){

alert("❌ بيانات الدخول غير صحيحة");

return;

}

if(user.role === "admin"){

window.location.href =
"index.html";

}

else if(user.role === "factory"){

window.location.href =
"factory.html";

}

else if(user.role === "client"){

window.location.href =
"client.html";

}

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO DESIGN Login</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:
radial-gradient(circle at top right,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom left,#0f172a 0%,transparent 40%),
#08111c;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

/* Background Glow */

.glow{
position:absolute;
width:500px;
height:500px;
background:#2563eb;
filter:blur(180px);
opacity:.15;
border-radius:50%;
top:-100px;
right:-100px;
}

/* Login Card */

.login-card{
position:relative;
width:100%;
max-width:430px;
background:rgba(13,23,36,.9);
border:1px solid rgba(255,255,255,.06);
backdrop-filter:blur(10px);
border-radius:32px;
padding:40px;
z-index:2;
box-shadow:
0 0 40px rgba(37,99,235,.12);
}

.logo{
font-size:42px;
font-weight:800;
color:#3b82f6;
text-align:center;
margin-bottom:10px;
letter-spacing:2px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:35px;
font-size:15px;
}

/* Inputs */

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:10px;
color:#cbd5e1;
font-size:15px;
}

.input-group input{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#08111c;
color:white;
font-size:16px;
outline:none;
transition:.3s;
border:1px solid transparent;
}

.input-group input:focus{
border-color:#2563eb;
box-shadow:0 0 15px rgba(37,99,235,.25);
}

/* Button */

.login-btn{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:800;
cursor:pointer;
transition:.3s;
margin-top:10px;
}

.login-btn:hover{
background:#1d4ed8;
transform:translateY(-2px);
}

/* Footer */

.footer{
text-align:center;
margin-top:25px;
color:#64748b;
font-size:14px;
}

.footer span{
color:#3b82f6;
font-weight:700;
}

/* Responsive */

@media(max-width:500px){

.login-card{
margin:20px;
padding:30px;
}

.logo{
font-size:34px;
}

}

</style>

</head>

<body>

<div class="glow"></div>

<div class="login-card">

<div class="logo">
🚀 PRO DESIGN
</div>

<div class="subtitle">
نظام إدارة التصنيع والتسعير والاعتماد
</div>

<div class="input-group">

<label>
اسم المستخدم
</label>

<input
type="text"
id="username"
placeholder="أدخل اسم المستخدم"
>

</div>

<div class="input-group">

<label>
كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="أدخل كلمة المرور"
>

</div>

<button
class="login-btn"
onclick="login()"
>

تسجيل الدخول

</button>

<div class="footer">

Powered By <span>Pro Design ERP</span>

</div>

</div>

<script>

function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

/* حساب تجريبي */

if(
username === "admin"
&&
password === "1234"
){

localStorage.setItem(
"isLoggedIn",
"true"
);

window.location.href =
"index.html";

}else{

alert("❌ بيانات الدخول غير صحيحة");

}

}

</script>

</body>
</html>

<script src="users.js"></script>

<script>

/* =========================
   Login
========================= */

function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

/* =========================
   Check User
========================= */

const user = users.find(u =>

u.username === username
&&
u.password === password

);

/* =========================
   Wrong Login
========================= */

if(!user){

alert("❌ بيانات الدخول غير صحيحة");

return;

}

/* =========================
   Save Session
========================= */

localStorage.setItem(
"isLoggedIn",
"true"
);

localStorage.setItem(
"userRole",
user.role
);

localStorage.setItem(
"userName",
user.name || ""
);

localStorage.setItem(
"clientId",
user.clientId || ""
);

/* =========================
   Redirect By Role
========================= */

switch(user.role){

case "admin":

window.location.href =
"index.html";

break;

case "designer":

window.location.href =
"index.html";

break;

case "factory":

window.location.href =
"factory.html";

break;

case "client":

window.location.href =
"client.html";

break;

default:

alert("❌ لا توجد صلاحية");

}

}

/* =========================
   Logout
========================= */

function logout(){

localStorage.clear();

window.location.href =
"login.html";

}

</script>

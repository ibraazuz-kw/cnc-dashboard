<!-- ========================= -->
<!-- إضافات الألبوم الذكريات -->
<!-- ========================= -->

<!-- 1) استبدل input الملف بهذا -->

<input
type="file"
id="memoryFile"
accept="image/*,video/*"
multiple>

<!-- ========================= -->
<!-- 2) استبدل قسم الألبوم بهذا -->
<!-- ========================= -->

<div
class="magic-book"
id="album">

</div>

<!-- ========================= -->
<!-- 3) أضف هذا داخل style -->
<!-- ========================= -->

<style>

.magic-book{

display:flex;
flex-wrap:wrap;
gap:40px;
justify-content:center;

}

/* صفحة كتاب */

.book-page{

width:420px;
min-height:600px;

background:
linear-gradient(
to right,
#4b311d,
#f4e4bc 8%,
#f8eac9 50%,
#f4e4bc 92%,
#4b311d
);

border-radius:15px;

padding:25px;

box-shadow:
0 15px 40px rgba(0,0,0,.5);

position:relative;

transform-style:preserve-3d;

animation:
flipPage 1s ease;

transition:.5s;

cursor:pointer;

}

.book-page:hover{

transform:
rotateY(-8deg)
scale(1.02);

}

@keyframes flipPage{

from{

transform:
rotateY(-90deg);

opacity:0;

}

to{

transform:
rotateY(0);

opacity:1;

}

}

/* حواف الورق */

.book-page::before{

content:'';

position:absolute;

top:0;
bottom:0;
left:0;

width:20px;

background:
linear-gradient(
to right,
rgba(0,0,0,.3),
transparent
);

border-radius:15px 0 0 15px;

}

/* الصور */

.book-page img,
.book-page video{

width:100%;
height:320px;
object-fit:cover;

border-radius:12px;

border:8px solid #f8f0dc;

box-shadow:
0 5px 20px rgba(0,0,0,.3);

margin-bottom:20px;

}

/* الكلام */

.page-content h3{

font-family:'Cinzel',serif;

font-size:32px;

margin-bottom:15px;

color:#4a2a12;

}

.page-content p{

font-size:18px;
line-height:2;

color:#4a2a12;

}

/* التاريخ */

.page-date{

margin-top:18px;

display:inline-block;

background:#5a3417;
color:#fff;

padding:8px 18px;

border-radius:50px;

font-size:14px;

}

/* حذف */

.delete-btn{

margin-top:20px;

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#8b1e1e;

color:#fff;

font-size:18px;

font-weight:700;

cursor:pointer;

}

</style>

<!-- ========================= -->
<!-- 4) استبدل كود الموسيقى -->
<!-- ========================= -->

<audio id="music" loop>

<source
src="https://cdn.pixabay.com/download/audio/2023/01/10/audio_d16737f4c8.mp3?filename=turkish-lounge-135842.mp3"
type="audio/mpeg">

</audio>

<!-- ========================= -->
<!-- 5) استبدل loadMemories بالكامل -->
<!-- ========================= -->

<script>

function loadMemories(){

const album =
document.getElementById(
'album'
);

album.innerHTML = '';

let memories =
JSON.parse(
localStorage.getItem(
'magicMemories'
)
) || [];

memories.forEach((m,index)=>{

const page =
document.createElement('div');

page.className =
'book-page';

let media='';

if(m.type.includes('video')){

media =
`
<video controls>
<source src="${m.file}">
</video>
`;

}else{

media =
`
<img src="${m.file}">
`;

}

page.innerHTML = `

${media}

<div class="page-content">

<h3>

${m.title}

</h3>

<p>

${m.text}

</p>

<div class="page-date">

✨ ذكرى قديمة

</div>

<button
class="delete-btn"
onclick="deleteMemory(${index})">

حذف الذكرى

</button>

</div>

`;

album.appendChild(page);

});

}

</script>

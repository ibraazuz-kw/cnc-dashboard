<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ذكرياتنا | PRO DESIGN
</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#050b24;
overflow-x:hidden;
color:white;
}

/* خلفية */

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top right,#ff660033,transparent 30%),
radial-gradient(circle at bottom left,#ffffff10,transparent 30%),
#050b24;
z-index:-2;
}

.stars{
position:fixed;
inset:0;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:.15;
z-index:-1;
animation:moveBg 50s linear infinite;
}

@keyframes moveBg{
from{transform:translateY(0);}
to{transform:translateY(-500px);}
}

/* البداية */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
}

.hero h1{
font-size:75px;
font-weight:900;
line-height:1.3;
margin-bottom:15px;
}

.hero h1 span{
color:#ff6600;
text-shadow:0 0 20px #ff6600;
}

.hero p{
font-size:24px;
opacity:.8;
max-width:700px;
line-height:1.9;
}

.scroll{
position:absolute;
bottom:30px;
font-size:18px;
opacity:.7;
animation:updown 2s infinite;
}

@keyframes updown{
0%,100%{transform:translateY(0);}
50%{transform:translateY(10px);}
}

/* رفع الذكريات */

.upload-box{

width:92%;
margin:40px auto;
background:#0b163f;
padding:35px;
border-radius:35px;
box-shadow:0 10px 30px rgba(0,0,0,.3);

}

.upload-box h2{

font-size:40px;
margin-bottom:25px;
text-align:center;

}

.upload-box input,
.upload-box textarea{

width:100%;
padding:18px;
margin-bottom:20px;
border:none;
border-radius:18px;
font-size:20px;

}

.upload-box textarea{

height:150px;
resize:none;

}

.upload-box button{

width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#ff6600;
color:#fff;
font-size:24px;
font-weight:700;
cursor:pointer;

}

/* العنوان */

.section-title{
text-align:center;
font-size:50px;
margin:80px 0 40px;
font-weight:900;
}

.section-title span{
color:#ff6600;
}

/* الألبوم */

.album{
width:92%;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
padding-bottom:80px;
}

.card{
background:#0b163f;
border-radius:30px;
overflow:hidden;
transition:.4s;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card:hover{
transform:translateY(-10px) scale(1.02);
}

.card img,
.card video{
width:100%;
height:320px;
object-fit:cover;
display:block;
}

.card-content{
padding:20px;
}

.card-content h3{
font-size:30px;
margin-bottom:10px;
font-weight:800;
}

.card-content p{
opacity:.8;
line-height:1.8;
font-size:17px;
margin-bottom:15px;
}

.date{
display:inline-block;
background:#ff6600;
padding:8px 18px;
border-radius:50px;
font-size:14px;
font-weight:bold;
}

.delete-btn{

margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#dc2626;
color:#fff;
font-size:20px;
font-weight:700;
cursor:pointer;

}

/* الموسيقى */

.music-btn{
position:fixed;
left:20px;
bottom:20px;
width:75px;
height:75px;
border:none;
border-radius:50%;
background:#ff6600;
color:white;
font-size:32px;
box-shadow:0 10px 25px rgba(255,102,0,.4);
z-index:999;
cursor:pointer;
}

/* الفوتر */

.footer{
padding:50px 20px;
text-align:center;
background:#020817;
margin-top:100px;
}

.footer h2{
font-size:40px;
margin-bottom:15px;
}

.footer p{
opacity:.7;
font-size:18px;
}

/* موبايل */

@media(max-width:768px){

.hero h1{
font-size:45px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:35px;
}

.card img,
.card video{
height:250px;
}

.upload-box h2{
font-size:30px;
}

}

</style>

</head>

<body>

<div class="bg"></div>
<div class="stars"></div>

<!-- موسيقى -->

<audio id="music" loop>

<source
src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=beautiful-piano-ambient-110624.mp3"
type="audio/mpeg">

</audio>

<button class="music-btn"
onclick="toggleMusic()">

🎵

</button>

<!-- البداية -->

<section class="hero">

<h1>

ذكرياتنا
<span>الجميلة</span>

</h1>

<p>

كل صورة هنا تحمل لحظة،
وكل فيديو يحمل شعور،
وهذا المكان بيبقى شاهد على أجمل أيامنا ✨

</p>

<div class="scroll">

⬇ اسحب للأسفل

</div>

</section>

<!-- رفع الذكريات -->

<div class="upload-box">

<h2>

إضافة ذكرى جديدة ✨

</h2>

<input type="text"
id="memoryTitle"
placeholder="عنوان الذكرى">

<textarea
id="memoryText"
placeholder="اكتب وصف الذكرى">
</textarea>

<input type="file"
id="memoryFile"
accept="image/*,video/*">

<button onclick="addMemory()">

إضافة الذكرى

</button>

</div>

<!-- عنوان -->

<h2 class="section-title">

أجمل
<span>اللحظات</span>

</h2>

<!-- الألبوم -->

<section class="album"
id="album">

</section>

<!-- الفوتر -->

<footer class="footer">

<h2>

PRO DESIGN

</h2>

<p>

ذكرياتنا محفوظة هنا للأبد ✨

</p>

</footer>

<script>

/* تشغيل الموسيقى */

const music =
document.getElementById("music");

function toggleMusic(){

if(music.paused){

music.play();

}else{

music.pause();

}

}

/* تشغيل تلقائي بعد أول لمسة */

window.addEventListener(
'click',
()=>{

music.play();

},
{once:true}
);

/* تحميل الذكريات */

loadMemories();

/* إضافة ذكرى */

function addMemory(){

const title =
document.getElementById(
'memoryTitle'
).value;

const text =
document.getElementById(
'memoryText'
).value;

const file =
document.getElementById(
'memoryFile'
).files[0];

if(!title || !file){

alert(
'أضف عنوان وملف'
);

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

const memory = {

title:title,
text:text,
file:e.target.result,
type:file.type

};

let memories =
JSON.parse(
localStorage.getItem(
'memories'
)
) || [];

memories.unshift(memory);

localStorage.setItem(
'memories',
JSON.stringify(memories)
);

document.getElementById(
'memoryTitle'
).value = '';

document.getElementById(
'memoryText'
).value = '';

document.getElementById(
'memoryFile'
).value = '';

loadMemories();

};

reader.readAsDataURL(file);

}

/* عرض الذكريات */

function loadMemories(){

const album =
document.getElementById(
'album'
);

album.innerHTML = '';

let memories =
JSON.parse(
localStorage.getItem(
'memories'
)
) || [];

memories.forEach((m,index)=>{

const card =
document.createElement('div');

card.className = 'card';

let media = '';

if(m.type.includes('video')){

media =
`
<video controls>
<source src="${m.file}">
</video>
`;

}else{

media =
`
<img src="${m.file}">
`;

}

card.innerHTML = `

${media}

<div class="card-content">

<h3>

${m.title}

</h3>

<p>

${m.text}

</p>

<div class="date">

✨ ذكرى جميلة

</div>

<button
class="delete-btn"
onclick="deleteMemory(${index})">

حذف الذكرى

</button>

</div>

`;

album.appendChild(card);

});

}

/* حذف */

function deleteMemory(index){

let memories =
JSON.parse(
localStorage.getItem(
'memories'
)
) || [];

memories.splice(index,1);

localStorage.setItem(
'memories',
JSON.stringify(memories)
);

loadMemories();

}

</script>

</body>
</html>

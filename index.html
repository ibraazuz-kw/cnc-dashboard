<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طلب CNC</title>

<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:15px}
.card{background:#111b27;padding:12px;border-radius:14px;margin-bottom:10px}
input,select,button,textarea{width:100%;padding:10px;border:none;border-radius:10px;margin:5px 0}
button{background:#2f7bff;color:#fff;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
</style>
</head>

<body>

<h2>🚀 طلب CNC سريع</h2>

<!-- نوع الشغل -->
<div class="card">
<select id="material">
<option>ألمنيوم</option>
<option>ألكبوند</option>
</select>

<select id="type">
<option>قص</option>
<option>حفر</option>
<option>قص + حفر</option>
</select>
</div>

<!-- القياسات -->
<div class="card">
<h4>📏 القياسات</h4>
<div id="doors"></div>
<button onclick="addDoor()">➕ إضافة قياس</button>
</div>

<!-- الشيتات -->
<div class="card">
<h4>📦 الشيتات</h4>
<div id="sheets"></div>
<button onclick="addSheet()">➕ إضافة شيت</button>
</div>

<!-- ملاحظات -->
<div class="card">
<textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea>
</div>

<button onclick="send()">🚀 إرسال الطلب</button>

<script>
const SIZES = ["122×244","122×350","150×300"];
const THICK = ["2mm","3mm","4mm","6mm","8mm"];

const doorsBox=document.getElementById("doors");
const sheetsBox=document.getElementById("sheets");

function addDoor(){
 const d=document.createElement("div");
 d.className="card";
 d.innerHTML=`
 <input placeholder="ارتفاع">
 <input placeholder="عرض">
 <select>
  <option>يمين</option>
  <option>يسار</option>
 </select>
 `;
 doorsBox.appendChild(d);
}

function addSheet(){
 const s=document.createElement("div");
 s.className="card";

 let sizeOptions=SIZES.map(x=>`<option>${x}</option>`).join("");
 let thickOptions=THICK.map(x=>`<option>${x}</option>`).join("");

 s.innerHTML=`
 <div class="row">
  <select class="size">${sizeOptions}</select>
  <select class="thick">${thickOptions}</select>
  <input type="number" value="1" class="qty">
 </div>
 `;
 sheetsBox.appendChild(s);
}

addDoor();
addSheet();

async function send(){

 const doors=[...doorsBox.children].map(d=>({
  h:d.children[0].value,
  w:d.children[1].value,
  dir:d.children[2].value
 }));

 const sheets=[...sheetsBox.children].map(s=>({
  size:s.querySelector(".size").value,
  thick:s.querySelector(".thick").value,
  qty:s.querySelector(".qty").value
 }));

 await fetch("/api/order",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    material:material.value,
    type:type.value,
    doors,
    sheets,
    notes:notes.value
  })
 });

 alert("✅ تم إرسال الطلب");

 // 🔥 يفضي الفورم
 doorsBox.innerHTML="";
 sheetsBox.innerHTML="";
 notes.value="";

 addDoor();
 addSheet();
}
</script>

</body>
</html>

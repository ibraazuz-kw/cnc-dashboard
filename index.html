<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>CNC Order</title>
<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:15px}
.card{background:#111b27;padding:12px;border-radius:14px;margin-bottom:10px}
input,select,button,textarea{width:100%;padding:10px;border:none;border-radius:10px;margin:5px 0}
button{background:#2f7bff;color:#fff;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
</style>
</head>
<body>

<h2>طلب CNC</h2>

<div class="card">
<select id="material">
<option>ألمنيوم</option>
<option>ألكبوند</option>
</select>

<select id="type">
<option>قص</option>
<option>حفر</option>
<option>قص + حفر</option>
</select>
</div>

<div class="card">
<h4>القياسات</h4>
<div id="doors"></div>
<button onclick="addDoor()">➕ إضافة قياس</button>
</div>

<div class="card">
<h4>الشيتات</h4>
<div id="sheets"></div>
<button onclick="addSheet()">➕ إضافة شيت</button>
</div>

<div class="card">
<input type="file" multiple>
<textarea id="notes" placeholder="ملاحظات"></textarea>
</div>

<button onclick="send()">🚀 إرسال</button>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

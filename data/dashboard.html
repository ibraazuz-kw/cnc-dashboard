<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>

<style>

body{
background:#f5f5f5;
font-family:Cairo;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
}

.number{
font-size:40px;
font-weight:bold;
color:#ff6600;
}

.title{
font-size:20px;
color:#00154F;
}

</style>
</head>

<body>

<h1>📊 لوحة التحكم</h1>

<div class="cards">

<div class="card">
<div class="number" id="customersCount">0</div>
<div class="title">العملاء</div>
</div>

<div class="card">
<div class="number" id="projectsCount">0</div>
<div class="title">المشاريع</div>
</div>

</div>

<script src="data.js"></script>

<script>

document.getElementById("customersCount").innerText =
customers.length;

document.getElementById("projectsCount").innerText =
projects.length;

</script>

</body>
</html>

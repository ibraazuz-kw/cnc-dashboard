<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{background:#0b0f14;color:#fff;font-family:Arial;padding:15px}
.card{background:#111b27;padding:12px;border-radius:14px;margin-bottom:10px}
button{padding:8px;background:#2f7bff;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>

<h2>الطلبات</h2>
<div id="orders"></div>

<script>
async function load(){
 const res=await fetch("/api/orders");
 const data=await res.json();
 const box=document.getElementById("orders");
 box.innerHTML="";

 data.forEach(o=>{
  box.innerHTML+=`
  <div class="card">
   <b>${o.material} - ${o.type}</b><br>
   الحالة: ${o.status}<br>
   <button onclick="set(${o.id})">تم</button>
  </div>`;
 });
}

async function set(id){
 await fetch("/api/status",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({id,status:"جاهز"})
 });
 load();
}

load();
</script>

</body>
</html>
